#title .series{font-size:13px;letter-spacing:.35em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
#title p{max-width:560px;font-size:clamp(15px,3.4vw,19px);line-height:1.5;opacity:.92;text-shadow:0 1px 6px #000}
#title .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:auto;margin-bottom:6vh}
/* card (black interludes) */

#card.on{display:flex}
#card .k{font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:10px}
#card .t{font-size:clamp(26px,6vw,46px);margin-bottom:22px}
#card .l{font-style:italic;font-size:clamp(17px,4vw,24px);max-width:640px;line-height:1.5;opacity:0;transition:opacity 1.6s;margin:8px 0}
#card .l.v{opacity:1}#card .l.out{color:#9fb4c8;font-style:normal;font-family:system-ui,sans-serif;font-size:clamp(15px,3.4vw,19px)}
/* game */

#top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;gap:8px;z-index:5}

#stageLbl b{color:#e8c37a;font-weight:normal}
#top .r{display:flex;gap:6px;flex-shrink:0}
#top button{padding:0 10px;font-size:15px}
#sceneWrap{position:absolute;overflow:hidden;border-radius:10px;box-shadow:0 10px 40px #000a;background:#000}
#scene{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 2.6s cubic-bezier(.4,0,.2,1)}
#pics{position:absolute;inset:0;transition:filter 2.2s}
#scene img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgc{opacity:0;transition:opacity 1.8s ease}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 100%);transition:opacity 2s}
#rain{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
.zone{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px}
#slot{border-radius:50%;background:none;animation:none}
#slot.filled{animation:none;background:none}
#slot.hint,#intr.hint{box-shadow:0 0 0 3px #ffd98a,0 0 28px 6px #ffd98a;animation:pulse 1.2s infinite;border-radius:50%}
#intr{border-radius:40%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.placed{position:absolute;--ax:-50%;--ay:-50%;transform:translate(var(--ax),var(--ay)) scale(.2);opacity:0;pointer-events:none;filter:drop-shadow(0 6px 8px #0008) sepia(.15);transition:transform .8s cubic-bezier(.2,1.6,.4,1),opacity .6s}
.placed.in{transform:translate(var(--ax),var(--ay)) scale(1);opacity:1}
.vanish{position:absolute;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;-webkit-backdrop-filter:blur(16px) saturate(.5) brightness(1.08);backdrop-filter:blur(16px) saturate(.5) brightness(1.08);-webkit-mask:radial-gradient(closest-side,#000 62%,transparent);mask:radial-gradient(closest-side,#000 62%,transparent);opacity:0;transition:opacity 1.4s}
.vanish.in{opacity:1}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff6d8;box-shadow:0 0 10px 3px #ffd98a;pointer-events:none;transform:translate(-50%,-50%);animation:spark 1.2s ease-out forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.ripple{position:absolute;width:40px;height:40px;border:2px solid #fff8;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:rip .6s ease-out forwards}

#panel{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
#task{font-size:clamp(13px,3.2vw,16px);opacity:.85;text-align:center;line-height:1.35;min-height:2.7em;padding:0 8px;transition:opacity .5s}
#tray{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.item{position:relative;aspect-ratio:1;border-radius:12px !important;background:rgba(42,35,51,.75);border:2px solid #4d4060;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;min-width:44px;min-height:44px;transition:opacity .6s,transform .3s,border-color .3s}

.item.sel{border-color:#ffd98a;box-shadow:0 0 14px #ffd98a;transform:translateY(-3px)}
.item.hint{border-color:#ffd98a;animation:pulse 1.2s infinite}
.item.used{pointer-events:none;border-style:dashed;border-color:#3a3048;background:rgba(42,35,51,.25)}

.shake{animation:shake .45s}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#ghost{position:fixed;width:84px;height:84px;pointer-events:none;transform:translate(-50%,-60%);z-index:50;display:none;filter:drop-shadow(0 8px 10px #000a)}
#next{display:none}
#dbg{position:fixed;left:6px;bottom:6px;background:#000c;color:#0f0;font:12px monospace;padding:4px 6px;z-index:99;pointer-events:none;white-space:pre}

/* final */
#end{background:#0d0b14;overflow:auto;touch-action:pan-y}

#end h3{font-weight:normal;color:#e8c37a;letter-spacing:.2em;text-transform:uppercase;font-size:13px;margin:26px 0 6px}
#end p{margin:4px 0;opacity:.9}
#end .small{font-size:13px;opacity:.65}

let ac=null,master=null,muted=localStorage.getItem('uiw_mute')==='1',beepTO=null,beepLevel=0,beepRate=1400,pad=null,rainNode=null,lullTO=null;
function initAudio(){

}
function updSnd(){$('#bSnd').textContent=muted?'🔈':'🔊'}

function tone(f,dur,vol,type='sine',when=0,dest){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(dest||master);o.start(t0);o.stop(t0+dur+.05)}

  const g=ac.createGain();g.gain.value=0;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900-stageIdx*50;g.connect(lp).connect(master);
  const os=ch.map((f,i)=>{const o=ac.createOscillator();o.type='triangle';o.frequency.value=f/2;o.detune.value=(i-1)*6;o.connect(g);o.start();return o});
  g.gain.setTargetAtTime(.025,ac.currentTime,1.5);pad={o:os,g};
}
function stopPad(){if(pad&&ac){const old=pad;old.g.gain.setTargetAtTime(0,ac.currentTime,.6);setTimeout(()=>old.o.forEach(o=>o.stop()),3000);pad=null}}
function noiseBuf(){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function setRain(on,vol=.12){if(!ac)return;if(on&&!rainNode){const s=ac.createBufferSource();s.buffer=noiseBuf();s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.6;const g=ac.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start();g.gain.setTargetAtTime(vol,ac.currentTime,1);rainNode={s,g}}else if(!on&&rainNode){const r=rainNode;r.g.gain.setTargetAtTime(0,ac.currentTime,.3);setTimeout(()=>r.s.stop(),2000);rainNode=null}}
function sfx(k){if(!ac)return;
  if(k==='good'){tone(784,.6,.12,'sine');tone(1175,.9,.09,'sine',.12);tone(1568,1.2,.05,'sine',.24)}
  if(k==='bad'){tone(140,.25,.15,'sine');tone(110,.3,.1,'sine',.05)}
  if(k==='vanish'){for(let i=0;i<7;i++)tone(900+i*180,.5,.04,'sine',i*.05)}
  if(k==='solve'){[523,659,784,1047].forEach((f,i)=>tone(f,1.6,.07,'sine',i*.18))}

  if(k==='crash'){const s=ac.createBufferSource();s.buffer=noiseBuf();const g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=2500;g.gain.setValueAtTime(.5,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.6);s.connect(f).connect(g).connect(master);s.start();s.stop(ac.currentTime+1.7);
    const o=ac.createOscillator(),og=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1400,ac.currentTime-0.8);o.frequency.setValueAtTime(1300,ac.currentTime);o.frequency.exponentialRampToValueAtTime(600,ac.currentTime+.7);og.gain.setValueAtTime(.05,ac.currentTime);og.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.8);o.connect(og).connect(master);o.start();o.stop(ac.currentTime+.9)}

// lullaby (Brahms, public domain) as a music box
const LUL=[[659,1],[659,1],[784,3],[659,1],[659,1],[784,3],[659,1],[784,1],[1047,2],[988,2],[880,2],[880,2],[784,2],[587,1],[659,1],[698,2],[587,2],[587,1],[659,1],[698,4]];

/* ---------- LAYOUT ---------- */
function layout(){

  } else {
    const tw=Math.min(W-pad*2,520),trayH=(tw-36)/7*2+6,panelH=trayH+130;
    let sw=W-pad*2,sh=sw*3/4; if(sh>H-top-panelH-pad){sh=H-top-panelH-pad;sw=sh*4/3}
    const y0=top+Math.max(0,(H-top-sh-panelH)/2.4);
    wrap.style.cssText=`left:${(W-sw)/2}px;top:${y0}px;width:${sw}px;height:${sh}px`;
    panel.style.cssText=`left:${(W-tw)/2}px;top:${y0+sh+10}px;width:${tw}px;height:${panelH}px;justify-content:flex-start`;
    $('#tray').style.gridTemplateColumns='repeat(7,1fr)';
  }

}

/* ---------- TRAY ---------- */
function buildTray(){
  const tr=$('#tray');tr.innerHTML='';
  const arr=D.items.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  arr.forEach(it=>{const d=document.createElement('div');d.className='item';d.dataset.id=it.id;d.title=it[L];d.innerHTML=`<img src="${it.img}" alt="${it.en}">`;
    attachDrag(d);tr.appendChild(d)});
}
function attachDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(busy||el.classList.contains('used'))return;e.preventDefault();initAudio();
    let moved=false;dragging=false;const sx=e.clientX,sy=e.clientY,g=$('#ghost');
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;dragging=true;g.src=el.querySelector('img').src;g.style.display='block';el.style.opacity=.35}
      if(moved){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
    const up=ev=>{setTimeout(()=>{dragging=false},0);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.style.display='none';el.style.opacity='';
      if(moved){
        if(!placed&&hit($('#slot'),ev.clientX,ev.clientY,24))tryPlace(el);
        else if(hit($('#sceneWrap'),ev.clientX,ev.clientY,0)){shake(el);ripple(ev.clientX,ev.clientY);miss()}
      } else {
        const was=sel===el;document.querySelectorAll('.item').forEach(i=>i.classList.remove('sel'));sel=was?null:el;if(sel){el.classList.add('sel');sfx('pick')}
      }};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
}
function hit(el,x,y,p){const r=el.getBoundingClientRect();return x>r.left-p&&x<r.right+p&&y>r.top-p&&y<r.bottom+p}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}}
function ripple(x,y){const w=$('#sceneWrap').getBoundingClientRect(),r=document.createElement('div');r.className='ripple';r.style.left=(x-w.left)+'px';r.style.top=(y-w.top)+'px';$('#sceneWrap').appendChild(r);setTimeout(()=>r.remove(),700)}
function sparks(x,y,n=14){const sc=$('#scene');for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.style.left=x+'%';s.style.top=y+'%';const a=Math.random()*6.28,d=30+Math.random()*60;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');sc.appendChild(s);setTimeout(()=>s.remove(),1300)}}

/* ---------- STAGE ---------- */
function stageLabel(){const s=D.stages[cur];$('#stageLbl').innerHTML=`<b>${t('stage')} ${cur+1}/10</b> · ${s.t[L]}`}
function setTask(){$('#task').textContent=placed&&removed?'':placed?t('placed'):removed?t('removed'):(hinted?D.stages[cur].hint[L]:t('task'))}

function dreamFilter(s,solved){const b=s.mood.b;return solved?`brightness(${b+0.12}) saturate(1.1)`:`brightness(${b*0.85}) saturate(.7) blur(.7px)`}
function loadStage(i){
  cur=i;placed=false;removed=false;sel=null;busy=false;hinted=false;

  document.querySelectorAll('.placed,.vanish,.spark').forEach(e=>e.remove());

  baseBeep=[.006+i*.0075,1500-i*70];misses=0;setBeep(baseBeep[0],baseBeep[1]);setPad(i);setRain(!!s.rain,.14);
  if(i===0)lullaby(.035,false);
  clearTimeout(hintTimer);hintTimer=setTimeout(showHint,45000);

}
function showHint(){if(placed&&removed)return;hinted=true;setTask();
  if(!placed){$('#slot').classList.add('hint');const it=document.querySelector(`.item[data-id="${D.stages[cur].item}"]`);it&&it.classList.add('hint')}

}
function miss(){
  if(placed&&removed)return;misses++;const s=D.stages[cur];

$('#sceneWrap').addEventListener('pointerup',e=>{

function removeIntruder(){

  sparks(s.intr.x,s.intr.y,18);sfx('vanish');setTask();check();

function check(){
  if(!(placed&&removed))return;busy=true;clearTimeout(hintTimer);

/* black interlude card */
function fadeCard(lines,cb,stepMs=1900){
  const c=$('#card');c.innerHTML='';show('card');
  lines.forEach(x=>{if(x.k){c.insertAdjacentHTML('beforeend',`<div class="k">${x.k}</div><div class="t">${x.tt}</div>`)}else{const d=document.createElement('div');d.className='l'+(x.out?' out':'');d.textContent=x.out||x.l;c.appendChild(d)}});
  const ls=[...c.querySelectorAll('.l')];ls.forEach((d,i)=>setTimeout(()=>d.classList.add('v'),400+i*stepMs));
  const total=600+ls.length*stepMs+1200;let done=false;const go=()=>{if(done)return;done=true;c.onpointerup=null;cb()};
  setTimeout(()=>{c.onpointerup=go},700);setTimeout(go,total+800);

/* rain particles */
let rainRAF=null;function rainOn(on){cancelAnimationFrame(rainRAF);const cv=$('#rain'),cx=cv.getContext('2d');cx.clearRect(0,0,cv.width,cv.height);if(!on)return;
  const drops=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),v:.012+Math.random()*.015,l:8+Math.random()*16}));
  const f=()=>{cx.clearRect(0,0,cv.width,cv.height);cx.strokeStyle='rgba(200,215,235,.45)';cx.lineWidth=1.2;cx.beginPath();
    drops.forEach(d=>{d.y+=d.v;d.x-=d.v*.15;if(d.y>1){d.y=-.05;d.x=Math.random()*1.1}const X=d.x*cv.width,Y=d.y*cv.height;cx.moveTo(X,Y);cx.lineTo(X-d.l*.15,Y+d.l)});cx.stroke();rainRAF=requestAnimationFrame(f)};f()}
/* climax */
function crash(){
  $('#next').style.display='none';busy=true;
  setTimeout(()=>{const fl=$('#flash');fl.style.transition='opacity .25s';fl.style.background='#fff7e0';fl.style.opacity=1;sfx('crash');setRain(false);stopPad();setBeep(0,1500);
    setTimeout(()=>{fl.style.transition='opacity 1.5s';fl.style.background='#000';
      setTimeout(()=>{fl.style.opacity=0;fl.style.transition='';rainOn(false);hospital()},1600)},600)},1200);
}
function hospital(){
  saveProg(D.stages.length);
  setBeep(.06,700);
  fadeCard([{out:t('v1')},{out:t('v2')},{out:t('v3')}],()=>{
    setBeep(.05,900);
    const c=$('#card');c.innerHTML=`<div class="k">${t('fin')}</div><div class="t">${t('finT')}</div><button class="big" id="bWake">${t('wake')}</button>`;show('card');
    $('#bWake').onclick=wake;
  },2600);
}
function wake(){
  initAudio();setBeep(0,1500);sfx('solve');setTimeout(()=>lullaby(.07,true),900);
  show('game');$('#task').style.display='none';$('#tray').innerHTML='';$('#next').style.display='none';
  $('#stageLbl').innerHTML=`<b>${t('fin')}</b> · ${t('finT')}`;
  document.querySelectorAll('.placed,.vanish,.spark').forEach(e=>e.remove());$('#slot').style.display='none';$('#intr').style.display='none';
  const fl=$('#flash');fl.style.transition='none';fl.style.background='#fff';fl.style.opacity=1;
  $('#bg').src=D.final.img;$('#bgc').style.opacity=0;$('#pics').style.filter='brightness(1.05) saturate(1.05)';$('#vignette').style.opacity=.2;const sc=$('#scene');sc.style.transformOrigin='50% 40%';sc.style.transform='scale(1.25)';
  $('#mem').classList.remove('v');
  setTimeout(()=>{fl.style.transition='opacity 4s';fl.style.opacity=0;sc.style.transform='scale(1)'},120);
  setTimeout(()=>{$('#mem').textContent=t('last');$('#mem').classList.add('v')},4200);
  setTimeout(()=>{const b=$('#next');b.textContent='♥';b.style.display='inline-block';b.onclick=credits},8000);
}
function credits(){
  localStorage.setItem('uiw_stage','0');
  const sk=L==='sk';
  $('#endInner').innerHTML=`<h1>${t('title1')}</h1><p style="font-style:italic;opacity:.8">${t('title2')} · ${t('series')}</p>
  <h3>${sk?'Nápad a príbeh':'Idea & story'}</h3><p>Stefan</p>
  <h3>${sk?'Témy jamu':'Jam themes'}</h3><p>DREAM + STAGE — ${sk?'sen v kóme a desať životných etáp':'a coma dream and ten stages of a life'}</p>
  <h3>${sk?'Použitie AI (povinné uvedenie)':'AI disclosure'}</h3>
  <p>${sk?'Všetky obrazy a predmety: generované AI (Grok Bot – generovanie obrázkov), odstránenie pozadia predmetov: rembg (AI).':'All paintings and items: AI-generated (Grok Bot image generation); item background removal: rembg (AI).'}</p>
  <p>${sk?'Kód hry (HTML/JavaScript) a syntetizované zvuky (WebAudio): napísané s AI asistentom (Grok Bot).':'Game code (HTML/JavaScript) and synthesized sounds (WebAudio): written with an AI assistant (Grok Bot).'}</p>
  <p>${sk?'Človek: nápad, príbeh, postava Eleny, výber a schválenie obrazov, smerovanie hry.':'Human: concept, story, Elena’s character, selection and approval of images, game direction.'}</p>
  <p class="small">${sk?'Uspávanka: J. Brahms, Wiegenlied (voľné dielo), syntetizovaná.':'Lullaby: J. Brahms, Wiegenlied (public domain), synthesized.'}</p>
  <h3>Ultimate AI-Powered Game Jam #7</h3><p class="small">13.–16. 11. 2026</p>
  <p style="margin-top:28px;font-style:italic">${sk?'Ďakujeme, že ste snívali s nami.':'Thank you for dreaming with us.'}</p>
  <p style="margin-top:20px"><button class="big" id="bAgain">${t('again')}</button></p>`;
  show('end');$('#bAgain').onclick=()=>{stopLullaby();location.reload()};
}
/* start / menu */
function begin(n){initAudio();stopLullaby();layout();
  if(n>=D.stages.length){hospital();return}
  const s=D.stages[n];
  const intro=n===0?[{l:t('pro1')},{l:t('pro2')},{l:t('pro3')}]:[];
  fadeCard([...intro,{k:`${t('stage')} ${n+1}`,tt:s.t[L]},{l:s.in[L]}],()=>{show('game');layout();loadStage(n)},n===0?2300:1900);
}
$('#bStart').onclick=()=>{saveProg(0);begin(0)};
$('#bCont').onclick=()=>begin(getProg());
$('#bMenu').onclick=()=>{if(confirm(t('menuQ'))){clearTimeout(hintTimer);setBeep(0,1500);stopPad();setRain(false);rainOn(false);show('title');applyLang()}};
if(DEBUG){const d=document.createElement('div');d.id='dbg';d.textContent='debug: tap scene for %';document.body.appendChild(d);
  addEventListener('keydown',e=>{if(e.key==='n'&&$('#game').classList.contains('on')){placed=removed=true;check()}})}
// debug jump: ?debug=1&stage=5
const qs=new URLSearchParams(location.search);
applyLang();layout();
if(DEBUG&&qs.get('stage')){const n=parseInt(qs.get('stage'),10)-1;show('game');layout();loadStage(n);if(qs.get('solve'))setTimeout(()=>{document.querySelector(`.item[data-id="${D.stages[n].item}"]`)&&tryPlace(document.querySelector(`.item[data-id="${D.stages[n].item}"]`));removeIntruder()},300)}
if(DEBUG&&qs.get('final')){wake()}
</script>
</body></html>
