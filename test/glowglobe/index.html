*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#050814;color:#e4ebf6;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.row{display:flex;gap:8px}.row .btn{flex:1;font-size:14px;padding:10px 6px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
.ov.on{display:flex}
.panel{max-width:520px;width:100%;text-align:center;background:rgba(7,11,22,0.85);border:1px solid #24344f;border-radius:18px;padding:24px 20px;max-height:92vh;overflow-y:auto}
h1{font-size:40px;color:#ffe7b3;text-shadow:0 0 28px rgba(240,180,41,0.55);margin-bottom:4px}
h2{font-size:24px;color:#ffe7b3;margin-bottom:8px}
h3{color:#9aa6bd;margin:12px 0 6px;text-align:left;font-size:14px}
p.tag{color:#9aa6bd;margin:6px 0 16px;font-size:14px}
p.fact{color:#e4ebf6;margin:8px 0;font-size:14px;line-height:1.5}
p.dim{color:#9aa6bd;font-size:13px}
p.funny{color:#f0b429;font-style:italic;font-size:15px;margin:10px auto 14px;max-width:380px;line-height:1.4}
.btn{display:block;width:100%;margin:9px 0;padding:13px;min-height:46px;font-size:16px;font-weight:600;border-radius:12px;border:1px solid #31405f;background:#16263f;color:#e4ebf6;cursor:pointer}
.btn.big{background:linear-gradient(180deg,#f0b429,#d19a1d);color:#1a1200;border:none;font-size:18px}
.btn.ghost{background:transparent}
.btn:active{transform:scale(0.98)}
.prog{margin:6px 0 14px;color:#9aa6bd;font-size:13px;text-align:left}
.prog span{display:block;margin-bottom:4px}
.bar{height:8px;border-radius:5px;background:#10192c;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f0b429,#ffe7b3);border-radius:5px}
#playhead{pointer-events:none;white-space:nowrap;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(7,11,22,0.8);border:1px solid #31405f;border-radius:999px;padding:8px 18px;font-size:15px;z-index:30}
#playhead .right{color:#f0b429;font-weight:700;margin-left:8px}
#playctl{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:32}
#playctl .ctl{white-space:nowrap;background:rgba(7,11,22,0.88);border:1px solid #3a4c70;color:#e4ebf6;border-radius:999px;min-height:46px;min-width:46px;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation}
#playctl .ctl:active{transform:scale(0.97)}
#playctl #b-hint{color:#6fdc7f;border-color:#2e5b36}
#hintn{color:#6fdc7f;font-weight:700}
.tut{pointer-events:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);background:rgba(7,11,22,0.8);border:1px solid #f0b429;border-radius:14px;padding:8px 16px;font-size:15px;line-height:1.35;text-align:center;z-index:34}
.tut .dim{font-size:13px}
.reg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0 6px}
.regcell{border:1px solid #31405f;border-radius:12px;padding:12px 6px;cursor:pointer;background:#10192c;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.regcell b{color:#e4ebf6;font-size:13px}
.regcell.done{background:#1e2a15;border-color:#8a6416}
.regcell.done b{color:#ffe7b3}
.regcell.lock{opacity:0.55;cursor:not-allowed}
.regcell i{color:#f0b429;font-style:normal;font-size:12px}
.ct{margin-bottom:4px}
.contpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 10px}

.ctbtn b{font-size:12px}
.ctbtn.done{border-color:#8a6416;background:#1e2a15}

.t2{font-size:13px;color:#6b7894;margin:8px 0 2px}

.cth{width:56px;height:42px;object-fit:cover;border-radius:8px;display:block;border:1px solid #31405f}
.ctbtn.done .cth{border-color:#f0b429;box-shadow:0 0 10px rgba(240,180,41,.55)}
.stars{color:#f0b429;font-size:10px;letter-spacing:1px}
.stars u{text-decoration:none;color:#31405f}
.cred{text-align:left;font-size:14px;line-height:1.5}
.cred p{margin:8px 0}
.cred b{color:#ffe7b3}
.cred .sm{font-size:12px;color:#9aa6bd}
.rewardick{font-size:64px;line-height:1;margin:4px auto}
.card .fact{font-size:14px;line-height:1.5;max-width:420px;margin:6px auto}
.card .limit{font-size:12px;color:#8a6416;margin-top:6px}
.card{text-align:center}
.bigbuy{font-size:60px;margin-bottom:6px}
.ie{font-size:12px;color:#6b7894;margin-top:8px;line-height:1.4}

.tut.warn{border-color:#ff9f5a}
.tut.bad{border-color:#ff5a5a;background:rgba(40,8,12,0.88);animation:shk .4s}
.tut b{color:#ffb3b3}

@keyframes pls{50%{box-shadow:0 0 18px 4px rgba(255,107,107,.7)}}

.bigstars{font-size:38px;color:#ffd678;letter-spacing:6px;text-shadow:0 0 18px rgba(240,180,41,.7);margin:2px 0}

.rule{margin-bottom:8px}.rule+.rule{border-top:1px solid #24344f;padding-top:10px}

/* Puzzle rules (shared by the game, the level generator and the tests).
   A puzzle pz = { s:startCity, g:goalCity, c:[cities], r:[[a,b,type,colour]], n:{city:N}, k:{city:colour}, o:[[a,b]], sol:[route] }
   Road types: 0 plain (both ways) | 1 one-way a->b | 2 locked gate (colour index) | 3 fragile bridge.
   Rules: visit every city exactly once, start at s, finish at g.
     number clue  - city with n[city]=N must be the N-th city lit (the start is 1st, the goal is last)
     one-way      - road type 1 may only be used from a to b
     gate         - road type 2 is closed until the key city of that colour (k) is lit
     fragile      - crossing any type-3 road collapses ALL type-3 roads (so at most one can be used)
     order        - o=[a,b]: a must be lit before b */
var GATE_COL=['#ff6b6b','#6fdc7f','#5aa8ff'],GATE_NAME=['red','green','blue'];
function puzPrep(pz){if(pz._p)return pz._p;
  var P={n:pz.c.length,out:{},numAt:{},keyOf:{},ordPre:{},hasNum:false,types:{}},i;
  for(i=0;i<pz.c.length;i++)P.out[pz.c[i]]={};
  for(i=0;i<pz.r.length;i++){var e=pz.r[i],t=e[2]||0,col=e[3]||0;
    P.out[e[0]][e[1]]={t:t,c:col,rev:false};P.out[e[1]][e[0]]={t:t,c:col,rev:t===1};P.types[t]=1;}
  for(var id in pz.n){P.numAt[pz.n[id]]=id;P.hasNum=true;}
  for(var kc in pz.k)P.keyOf[pz.k[kc]]=kc;
  for(i=0;i<(pz.o||[]).length;i++){var o=pz.o[i];(P.ordPre[o[1]]=P.ordPre[o[1]]||[]).push(o[0]);}
  pz._p=P;return P;}
function puzState(pz,path){var P=puzPrep(pz),vis={},broken=false;
  for(var i=0;i<path.length;i++){vis[path[i]]=i+1;if(i>0){var e=P.out[path[i-1]][path[i]];if(e&&e.t===3)broken=true;}}
  return{vis:vis,broken:broken};}
/* '' when the move path.last -> to is legal, otherwise a reason code */
function puzCheck(pz,path,vis,broken,to){var P=puzPrep(pz),u=path[path.length-1],e=P.out[u][to];
  if(vis[to])return 'visited';
  if(!e)return 'noroad';
  if(e.rev)return 'oneway';
  if(e.t===2&&!vis[P.keyOf[e.c]])return 'gate:'+e.c;
  if(e.t===3&&broken)return 'broken';
  var step=path.length+1;
  if(pz.n[to]!==undefined){if(pz.n[to]!==step)return 'num:'+pz.n[to];}
  else if(P.numAt[step]!==undefined)return 'reserved:'+P.numAt[step];
  var pre=P.ordPre[to];if(pre)for(var i=0;i<pre.length;i++)if(!vis[pre[i]])return 'order:'+pre[i];
  return '';}
/* legal moves that can still lead somewhere (the goal only counts as the very last city) */
function puzMoves(pz,path){var P=puzPrep(pz),st=puzState(pz,path),u=path[path.length-1],r=[];
  for(var to in P.out[u]){if(to===pz.g&&path.length+1<P.n)continue;if(puzCheck(pz,path,st.vis,st.broken,to)==='')r.push(to);}return r;}
/* exhaustive solver: counts complete routes (stops at limit); nodes = search effort, dead = dead ends met */
function puzSolve(pz,limit){var P=puzPrep(pz),n=P.n,res={count:0,first:null,nodes:0,dead:0},path=[pz.s],vis={};vis[pz.s]=1;
  function dfs(broken){res.nodes++;
    if(path.length===n){if(path[n-1]===pz.g){res.count++;if(!res.first)res.first=path.slice();}return res.count>=limit;}
    var u=path[path.length-1],outs=P.out[u],moved=false;
    for(var to in outs){if(vis[to])continue;if(to===pz.g&&path.length+1<n)continue;
      if(puzCheck(pz,path,vis,broken,to)!=='')continue;
      moved=true;path.push(to);vis[to]=path.length;var stop=dfs(broken||outs[to].t===3);path.pop();delete vis[to];if(stop)return true;}
    if(!moved)res.dead++;return false;}
  dfs(false);return res;}
/*RULES-END*/

/* ---- camera ---- */
function cameraFromBox(box,w,h,ins){
  var mean=(box.minLat+box.maxLat)/2;var cosx=Math.max(0.35,Math.cos(mean*Math.PI/180));
  var worldW=Math.max(0.8,box.maxLon-box.minLon);var worldH=Math.max(0.8,(box.maxLat-box.minLat)*cosx);
  var aw=Math.max(40,w-ins.left-ins.right);var ah=Math.max(40,h-ins.top-ins.bottom);
  var scale=Math.min(aw/worldW,ah/worldH);
  return{minLon:box.minLon,maxLon:box.maxLon,minLat:box.minLat,maxLat:box.maxLat,cos:cosx,scale:scale,ox:ins.left+(aw-worldW*scale)/2,oy:ins.top+(ah-worldH*scale)/2,north:box.maxLat*cosx};}
function project(cam,lon,lat){return{x:cam.ox+(lon-cam.minLon)*cam.scale,y:cam.oy+(cam.north-lat*cam.cos)*cam.scale};}
function cameraForRegion(region,w,h,ins){var ml=1e9,ML=-1e9,mB=1e9,MB=-1e9;
  for(var i=0;i<region.cities.length;i++){var cc=region.cities[i];
    if(cc.lon<ml)ml=cc.lon;if(cc.lon>ML)ML=cc.lon;if(cc.lat<mB)mB=cc.lat;if(cc.lat>MB)MB=cc.lat;}
  var sl=Math.max(1.8,ML-ml),sb=Math.max(1.4,MB-mB);
  return cameraFromBox({minLon:ml-sl*0.3,maxLon:ML+sl*0.3,minLat:mB-sb*0.3,maxLat:MB+sb*0.3},w,h,ins);}
function worldCamera(w,h,ins){return cameraFromBox({minLon:-170,maxLon:194,minLat:-52,maxLat:76},w,h,ins);}
function ringsCamera(rings,w,h,ins){var ml=1e9,ML=-1e9,mB=1e9,MB=-1e9;
  for(var a=0;a<rings.length;a++)for(var b2=0;b2<rings[a].length;b2++){var p=rings[a][b2];if(p[0]<ml)ml=p[0];if(p[0]>ML)ML=p[0];if(p[1]<mB)mB=p[1];if(p[1]>MB)MB=p[1];}
  if(!isFinite(ml))return worldCamera(w,h,ins);
  return cameraFromBox({minLon:ml-1,maxLon:ML+1,minLat:mB-1,maxLat:MB+1},w,h,ins);}
function trace(cam,rings){ctx.beginPath();
  for(var i=0;i<rings.length;i++){var r=rings[i];if(r.length<3)continue;var p0=project(cam,r[0][0],r[0][1]);ctx.moveTo(p0.x,p0.y);
    for(var j=1;j<r.length;j++){var p=project(cam,r[j][0],r[j][1]);ctx.lineTo(p.x,p.y);}ctx.closePath();}}

var SAVE_KEY='glow-globe-v1';
function fresh(){return{v:3,sound:true,tutorial:0,hints:{},stars:{},seen:{},currentContinent:'europe',currentRegion:'uk',partial:{},doneRegions:[],doneContinents:[]};}
function hasProgress(s){return s.doneRegions.length||s.tutorial>0||Object.keys(s.partial).some(function(k){return s.partial[k]&&s.partial[k].length>1;});}
/* Save format: v1 (old), v2 and v3 (current) are accepted. Older saves keep their finished regions, but
   routes in progress, hints and stars are reset because the levels became real puzzles. Corrupt data -> fresh save. */
function load(){try{var raw=localStorage.getItem(SAVE_KEY);if(!raw)return fresh();var d=JSON.parse(raw);
  if(!d||typeof d!=='object'||(d.v!==1&&d.v!==2&&d.v!==3))return fresh();
  var f=fresh(),old=d.v<3;for(var k in f)if(d[k]===undefined||d[k]===null)d[k]=f[k];
  if(!Array.isArray(d.doneRegions))d.doneRegions=[];
  if(old||typeof d.partial!=='object'||Array.isArray(d.partial))d.partial={};
  if(old||typeof d.hints!=='object'||Array.isArray(d.hints))d.hints={};
  if(old||typeof d.stars!=='object'||Array.isArray(d.stars))d.stars={};
  if(old||typeof d.seen!=='object'||Array.isArray(d.seen))d.seen={};
  d.doneRegions=d.doneRegions.filter(function(id,i,a){return !!findRegion(id)&&a.indexOf(id)===i;});
  for(var sk in d.stars)if(d.doneRegions.indexOf(sk)<0||!(d.stars[sk]>=0&&d.stars[sk]<=3))delete d.stars[sk];
  d.doneContinents=DATA.filter(function(c){return c.regions.every(function(r){return d.doneRegions.indexOf(r.id)>=0;});}).map(function(c){return c.id;});

function insets(){return H<430?{top:56,right:12,bottom:72,left:12}:{top:H<760?92:104,right:16,bottom:96,left:16};}
function layout(region){var ins=insets();

  var pts=region.cities.map(function(c){var p=project(cam,c.lon,c.lat);return{c:c,x:p.x,y:p.y,sx:p.x,sy:p.y};});
  var lim={minX:ins.left+10,minY:ins.top+6,maxX:W-ins.right-10,maxY:H-ins.bottom-6};
  var minD=Math.min(64,Math.max(44,Math.min(lim.maxX-lim.minX,lim.maxY-lim.minY)/(pts.length>7?5.2:4.6)));
  for(var it=0;it<50;it++){for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){var dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y,d=Math.hypot(dx,dy);
    if(d<minD){if(d<0.01){dx=j-i+0.4;dy=0.8;d=1;}var push=(minD-d)/2,u=dx/d,v=dy/d;pts[i].x-=u*push;pts[i].y-=v*push;pts[j].x+=u*push;pts[j].y+=v*push;}}
    for(var k=0;k<pts.length;k++){pts[k].x=pts[k].x*0.9+pts[k].sx*0.1;pts[k].y=pts[k].y*0.9+pts[k].sy*0.1;pts[k].x=clamp(pts[k].x,lim.minX,lim.maxX);pts[k].y=clamp(pts[k].y,lim.minY,lim.maxY);}}
  return pts;}

/* ---- label placement: score candidate spots around each dot against other labels, other dots and the screen edge ---- */
var LDIRS=[[14,0,0],[-14,0,2],[0,-22,1],[0,22,1],[12,-18,0],[-12,-18,2],[12,18,0],[-12,18,2],[0,-40,1],[0,40,1],[30,-16,0],[-30,-16,2],[30,16,0],[-30,16,2],[46,0,0],[-46,0,2],[0,-58,1],[0,58,1]];
function labelRect(c,d,wd){var tx=c.x+d[0],ty=c.y+d[1],x0=d[2]===0?tx:d[2]===2?tx-wd:tx-wd/2;return{x0:x0-6,x1:x0+wd+6,y0:ty-10,y1:ty+10,tx:tx,ty:ty};}
function ovl(a,b){var w=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0),h=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);return(w>0&&h>0)?w*h:0;}
function assignLabels(){ctx.font='600 13px system-ui,sans-serif';
  var cs=S.cities,n=cs.length,ins=insets(),bx0=4,bx1=W-4,by0=Math.max(50,ins.top-20),by1=H-ins.bottom+16;
  var ws=cs.map(function(c){return ctx.measureText(c.c.name).width;});
  var dots=cs.map(function(c){var r=c.pad||8;return{x0:c.x-r,x1:c.x+r,y0:c.y-r,y1:c.y+r};});
  var own=cs.map(function(c){var r=(c.pad||8)-3;return{x0:c.x-r,x1:c.x+r,y0:c.y-r,y1:c.y+r};});
  var pick=[],rects=[],i,k;
  var crowd=cs.map(function(c,a){var m=0;for(var b=0;b<n;b++)if(b!==a&&Math.hypot(cs[b].x-c.x,cs[b].y-c.y)<95)m++;return m;});
  var order=cs.map(function(c,a){return a;}).sort(function(a,b){return crowd[b]-crowd[a];});
  function score(a,kk){var d=LDIRS[kk],r=labelRect(cs[a],d,ws[a]),sc=Math.hypot(d[0],d[1])*0.35;
    if(r.x0<bx0)sc+=(bx0-r.x0)*60;if(r.x1>bx1)sc+=(r.x1-bx1)*60;if(r.y0<by0)sc+=(by0-r.y0)*60;if(r.y1>by1)sc+=(r.y1-by1)*60;
    for(var j=0;j<n;j++){if(j===a)continue;sc+=ovl(r,dots[j])*10;if(rects[j])sc+=ovl(r,rects[j])*6;}
    sc+=ovl(r,own[a])*10;return sc;}
  for(var pass=0;pass<4;pass++){for(var oi=0;oi<order.length;oi++){i=order[oi];var bk=0,bs=1e12;for(k=0;k<LDIRS.length;k++){var s=score(i,k);if(s<bs){bs=s;bk=k;}}pick[i]=bk;rects[i]=labelRect(cs[i],LDIRS[bk],ws[i]);}}
  for(i=0;i<n;i++){var c=cs[i],d=LDIRS[pick[i]];c.textX=c.x+d[0];c.textY=c.y+d[1];c.align=d[2]===1?'center':d[2]===0?'left':'right';c.rect=rects[i];c.leader=Math.hypot(d[0],d[1])>30;c.hide=false;}
  for(i=0;i<n;i++)for(var j2=i+1;j2<n;j2++)if(ovl(rects[i],rects[j2])>24){cs[j2].hide=true;}}

/* ---- rule cards: one screen per new rule (icon + one sentence + a tiny example) ---- */
var RULE_TXT={
 basic:['Start, goal, one route','Start at the glowing power plant, light every city exactly once and finish at the star goal. Only ONE route works - find it!'],
 num:['Number clues','A number on a city is its place in your route. A city marked 3 must be the 3rd city you light.'],
 one:['One-way roads','Arrows show one-way roads. You can only travel the way the arrow points.'],
 gate:['Locked gates','A coloured road is a locked gate. Light the city that holds the matching key to open it.'],
 frag:['Fragile bridges','Dashed bridges are fragile: the moment you cross one, ALL dashed bridges collapse. Use at most one!'],
 ord:['Order arrows','A purple dotted arrow from A to B means: light A before B.'],
 mix:['Everything at once','Asia mixes the rules: start and goal, numbers, one-way roads, gates, fragile bridges and order arrows. Same goal: one perfect route.']};
function svgNode(x,y,kind,txt,col){var o='';
  if(kind==='start')return '<circle cx="'+x+'" cy="'+y+'" r="13" fill="#f0b429" stroke="#fff2cc" stroke-width="2"/><polygon points="'+(x+1)+','+(y-8)+' '+(x-6)+','+(y+2)+' '+(x-1)+','+(y+2)+' '+(x-2)+','+(y+9)+' '+(x+6)+','+(y-2)+' '+(x+1)+','+(y-2)+'" fill="#3a2600"/>';
  if(kind==='goal'){var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?5:11;p.push((x+Math.cos(a)*r).toFixed(1)+','+(y+Math.sin(a)*r).toFixed(1));}return '<circle cx="'+x+'" cy="'+y+'" r="14" fill="#16263f" stroke="#ffe7b3" stroke-width="2"/><polygon points="'+p.join(' ')+'" fill="#ffd678"/>';}
  if(kind==='num')return '<circle cx="'+x+'" cy="'+y+'" r="12" fill="#1b2c4c" stroke="#cfe0ff" stroke-width="2"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+txt+'</text>';
  if(kind==='key')return '<circle cx="'+x+'" cy="'+y+'" r="8" fill="#8e9bb3"/><circle cx="'+x+'" cy="'+y+'" r="13" fill="none" stroke="'+col+'" stroke-width="3"/>';
  return '<circle cx="'+x+'" cy="'+y+'" r="8" fill="#8e9bb3"/>';}
function svgLine(x1,y1,x2,y2,extra){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+(extra||'stroke="#b9d0f4" stroke-width="3"')+'/>';}
function svgEx(k){var h='<svg viewBox="0 0 240 70" width="240" height="70">';
  if(k==='basic')h+=svgLine(36,35,100,35)+svgLine(100,35,140,35)+svgLine(140,35,204,35)+svgNode(36,35,'start')+svgNode(100,35,'')+svgNode(140,35,'')+svgNode(204,35,'goal');
  else if(k==='num')h+=svgLine(36,35,100,35)+svgLine(100,35,170,35)+svgLine(170,35,204,35)+svgNode(36,35,'start')+svgNode(100,35,'')+svgNode(170,35,'num','3')+svgNode(204,35,'goal');
  else if(k==='one')h+=svgLine(40,35,200,35)+'<polygon points="130,35 112,26 112,44" fill="#ffd678"/>'+svgNode(40,35,'start')+svgNode(200,35,'');
  else if(k==='gate')h+=svgLine(40,35,200,35,'stroke="#ff6b6b" stroke-width="5"')+'<rect x="112" y="30" width="16" height="13" rx="3" fill="#ff6b6b"/><path d="M115 30 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#ff6b6b" stroke-width="3"/>'+svgNode(40,35,'key','','#ff6b6b')+svgNode(200,35,'');
  else if(k==='frag')h+=svgLine(40,35,200,35,'stroke="#ff9f5a" stroke-width="4" stroke-dasharray="9 7"')+'<polyline points="116,26 122,35 114,40 124,46" fill="none" stroke="#ffd2a8" stroke-width="2.5"/>'+svgNode(40,35,'')+svgNode(200,35,'');
  else if(k==='ord')h+=svgNode(40,48,'')+svgNode(200,48,'')+'<path d="M48 40 Q120 -6 192 40" fill="none" stroke="#d98cff" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/><polygon points="194,42 182,42 188,32" fill="#d98cff"/><text x="40" y="26" text-anchor="middle" font-size="13" fill="#d98cff" font-weight="700">A</text><text x="200" y="26" text-anchor="middle" font-size="13" fill="#d98cff" font-weight="700">B</text>';
  else h+=svgLine(30,35,100,35)+svgLine(100,35,170,35,'stroke="#ff6b6b" stroke-width="5"')+svgNode(30,35,'start')+svgNode(100,35,'num','2')+svgNode(170,35,'goal')+'<polygon points="64,35 52,28 52,42" fill="#ffd678"/><polyline points="196,26 202,35 194,40 204,46" fill="none" stroke="#ff9f5a" stroke-width="2.5"/>';
  return h+'</svg>';}

function icoBolt(x,y,s,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x+1*s,y-8*s);ctx.lineTo(x-6*s,y+2*s);ctx.lineTo(x-1*s,y+2*s);ctx.lineTo(x-2*s,y+9*s);ctx.lineTo(x+6*s,y-2*s);ctx.lineTo(x+1*s,y-2*s);ctx.closePath();ctx.fill();}
function icoStar(x,y,R,r,fill,stroke){ctx.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
function icoLock(x,y,col,open){ctx.fillStyle='rgba(7,11,22,0.9)';ctx.beginPath();ctx.arc(x,y,10,0,TAU);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();

  ctx.beginPath();ctx.arc(x-2.5,y,2.2,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(x-0.5,y);ctx.lineTo(x+4,y);ctx.moveTo(x+2.5,y);ctx.lineTo(x+2.5,y+2.5);ctx.stroke();}
function icoArrow(x,y,ang,sz,fill){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='rgba(7,11,22,0.85)';ctx.beginPath();ctx.arc(0,0,sz+2.5,0,TAU);ctx.fill();ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(sz,0);ctx.lineTo(-sz*0.8,-sz*0.85);ctx.lineTo(-sz*0.8,sz*0.85);ctx.closePath();ctx.fill();ctx.restore();}

function drawPlay(){var fr=findRegion(S.regId);var continent=fr.continent,region=fr.region,pz=S.pz,P=puzPrep(pz);

  var rings0=RINGS[region.id];if(rings0){ctx.beginPath();trace(cam,rings0);ctx.fillStyle='#1b2c4c';ctx.fill();
    if(glowAmt>0){var ga=Math.min(1,glowAmt);ctx.globalAlpha=0.28+ga*0.5;ctx.fillStyle='#e0ae45';ctx.fill();
      ctx.globalAlpha=0.4*ga;ctx.lineWidth=8;ctx.strokeStyle='#f0b429';ctx.stroke();}
    ctx.globalAlpha=1;ctx.lineWidth=1.6;ctx.strokeStyle=glowAmt>0?'#ffe7b3':'#e6c98a';ctx.stroke();}
  var lit=[];for(var k=0;k<S.path.length;k=k+1){var c2=id2city[S.path[k]];if(c2)lit.push(c2);}
  var R,e,na,nb2,mx,my,ang;ctx.lineCap='round';
  // plain + one-way roads: soft underglow + solid bright line
  ctx.strokeStyle='rgba(110,150,225,0.16)';ctx.lineWidth=8;ctx.beginPath();
  for(R=0;R<pz.r.length;R++){e=pz.r[R];na=id2city[e[0]];nb2=id2city[e[1]];if(!na||!nb2||e[2]===2||e[2]===3)continue;ctx.moveTo(na.x,na.y);ctx.lineTo(nb2.x,nb2.y);}ctx.stroke();
  ctx.strokeStyle='rgba(185,208,244,0.92)';ctx.lineWidth=2.4;ctx.beginPath();

  // gates, fragile bridges
  for(R=0;R<pz.r.length;R++){e=pz.r[R];na=id2city[e[0]];nb2=id2city[e[1]];if(!na||!nb2)continue;mx=(na.x+nb2.x)/2;my=(na.y+nb2.y)/2;
    if(e[2]===2){var col=GATE_COL[e[3]],open=!!S.vis[P.keyOf[e[3]]];
      ctx.strokeStyle=col;ctx.globalAlpha=open?0.45:1;ctx.lineWidth=open?2:4.5;if(open)ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb2.x,nb2.y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
      icoLock(mx,my,col,open);}
    else if(e[2]===3){var bk=S.broken;ctx.strokeStyle=bk?'rgba(255,90,90,0.4)':'#ff9f5a';ctx.lineWidth=bk?1.5:3;ctx.setLineDash(bk?[2,8]:[9,7]);ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb2.x,nb2.y);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle=bk?'rgba(255,120,120,0.8)':'#ffd2a8';ctx.lineWidth=2;ctx.beginPath();
      if(bk){ctx.moveTo(mx-5,my-5);ctx.lineTo(mx+5,my+5);ctx.moveTo(mx+5,my-5);ctx.lineTo(mx-5,my+5);}else{ctx.moveTo(mx-3,my-7);ctx.lineTo(mx+2,my-1);ctx.lineTo(mx-3,my+2);ctx.lineTo(mx+3,my+8);}ctx.stroke();}
    else if(e[2]===1){ang=Math.atan2(nb2.y-na.y,nb2.x-na.x);icoArrow(mx,my,ang,7,'#ffd678');}}

    var dx=B.x-A.x,dy=B.y-A.y,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl,cx=(A.x+B.x)/2+nx*dl*0.28,cy=(A.y+B.y)/2+ny*dl*0.28;
    var sat=!!S.vis[pz.o[oi][0]];ctx.strokeStyle=sat?'rgba(217,140,255,0.4)':'#d98cff';ctx.lineWidth=2.4;ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo(cx,cy,B.x,B.y);ctx.stroke();ctx.setLineDash([]);
    var tx=B.x-cx,ty=B.y-cy,tl=Math.hypot(tx,ty)||1,bx=B.x-tx/tl*16,by=B.y-ty/tl*16;
    ctx.fillStyle=sat?'rgba(217,140,255,0.5)':'#d98cff';ctx.save();ctx.translate(bx,by);ctx.rotate(Math.atan2(ty,tx));ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,-5.5);ctx.lineTo(-5,5.5);ctx.closePath();ctx.fill();ctx.restore();}

    ctx.strokeStyle='rgba(240,180,41,0.95)';ctx.lineWidth=3.4;ctx.beginPath();ctx.moveTo(lit[0].x,lit[0].y);for(var L=1;L<lit.length;L++)ctx.lineTo(lit[L].x,lit[L].y);ctx.stroke();

  var lastC=lit.length?lit[lit.length-1]:null;
  if(lastC&&S.nextIds.length&&!S.busy&&!S.dead){var pu=0.55+Math.sin(S.t*5)*0.25;ctx.strokeStyle='rgba(255,226,150,'+pu+')';ctx.lineWidth=3;
    for(var q=0;q<S.nextIds.length;q++){var nn=id2city[S.nextIds[q]];if(!nn)continue;ctx.beginPath();ctx.moveTo(lastC.x,lastC.y);ctx.lineTo(nn.x,nn.y);ctx.stroke();}}
  if(lastC){ctx.strokeStyle=S.dead?'#ff6b6b':'#f0b429';ctx.lineWidth=2;ctx.beginPath();ctx.arc(lastC.x,lastC.y,(lastC.pad>8?19:11)+Math.sin(S.t*4),0,TAU);ctx.stroke();}
  ctx.font='600 13px system-ui,sans-serif';ctx.textBaseline='middle';
  for(var i=0;i<S.cities.length;i++){var c=S.cities[i];var cid=c.c.id,litNow=S.lit.has(cid);

    if(litNow){var age=S.t-(S.litAt[cid]===undefined?-9:S.litAt[cid]);var pop=(age>=0&&age<0.4)?1+0.9*Math.pow(1-age/0.4,2):1;var r2=(c.pad>8?8.5:6.2)*sc*pop;
      if(age>=0&&age<0.55){ctx.fillStyle='rgba(255,236,170,'+(0.3*(1-age/0.55))+')';ctx.beginPath();ctx.arc(x,y,r2*(3.2+age*9),0,TAU);ctx.fill();}
      ctx.fillStyle='rgba(240,180,41,0.16)';ctx.beginPath();ctx.arc(x,y,r2*3.2,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,214,120,0.38)';ctx.beginPath();ctx.arc(x,y,r2*1.75,0,TAU);ctx.fill();
      ctx.fillStyle='#fff8ea';ctx.beginPath();ctx.arc(x,y,numN!==undefined||isStart||isGoal?r2*1.15:r2*0.62,0,TAU);ctx.fill();}
    else{var r3=(hover?7:5)*sc;
      if(nextNow){var np=Math.sin(S.t*5);ctx.fillStyle='rgba(240,180,41,'+(0.14+0.08*np)+')';ctx.beginPath();ctx.arc(x,y,(c.pad>8?21:15)+np*2,0,TAU);ctx.fill();
        ctx.strokeStyle='rgba(255,214,120,0.95)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,(c.pad>8?18:12)+np*1.5,0,TAU);ctx.stroke();r3=6.5*sc;}
      if(numN!==undefined||isGoal){ctx.fillStyle='#1b2c4c';ctx.strokeStyle=nextNow?'#ffe7b3':'#cfe0ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,11*sc,0,TAU);ctx.fill();ctx.stroke();}
      else{ctx.fillStyle=nextNow?'#ffe7b3':hover?'#e7eefb':'#8e9bb3';ctx.beginPath();ctx.arc(x,y,r3,0,TAU);ctx.fill();}}
    // marks: start bolt, goal star, number
    if(isStart){ctx.strokeStyle='#ffe7b3';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,12.5,0,TAU);ctx.stroke();icoBolt(x,y,1,'#3a2600');}
    else if(isGoal){icoStar(x,y,9.5,4,litNow?'#3a2600':'#ffd678',litNow?'#3a2600':null);}
    else if(numN!==undefined){ctx.fillStyle=litNow?'#3a2600':'#fff';ctx.font='700 13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(''+numN,x,y+0.5);ctx.font='600 13px system-ui,sans-serif';}
    if(keyC!==undefined){var kc=GATE_COL[keyC];ctx.strokeStyle=kc;ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(x,y,(c.pad>8?16:11)+0.5,0,TAU);ctx.stroke();icoKey(x+12,y-13,kc);}
    if(c.hide&&!(pressed||hover||hintNow))continue;
    if(c.leader){ctx.strokeStyle='rgba(154,166,189,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(clamp(c.x,c.rect.x0,c.rect.x1),clamp(c.y,c.rect.y0,c.rect.y1));ctx.stroke();}
    var wd=ctx.measureText(c.c.name).width;var left=c.align==='left'?c.textX:c.align==='right'?c.textX-wd:c.textX-wd/2;
    ctx.fillStyle='rgba(7,11,22,0.82)';ctx.beginPath();ctx.roundRect(left-6,c.textY-10,wd+12,20,8);ctx.fill();
    ctx.fillStyle=litNow?'#ffe7b3':'#e4ebf6';ctx.textAlign=c.align;ctx.fillText(c.c.name,c.textX,c.textY);}}

function drawFrame(){var dt=Math.min(0.05,(performance.now()-LAST)/1000);LAST=performance.now();S.t+=dt;stepFx(dt);
  drawBg();ctx.save();if(shake>0.2)ctx.translate(Math.sin(S.t*46)*shake,Math.cos(S.t*39)*shake*0.6);
  if((S.screen==='play'||S.screen==='rule')&&S.cities.length&&S.pz)drawPlay();
  else if(S.screen==='hero')drawHero();
  else if(S.screen==='world')drawWorld();
  else drawAtlasFrame();
  ctx.restore();
  for(var r=0;r<rings.length;r++){var rg=rings[r],k=rg.t/rg.max;ctx.strokeStyle='rgba(255,226,150,'+(0.85*(1-k))+')';ctx.lineWidth=(rg.big?4:2.4)*(1-k)+0.6;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r0+(rg.r1-rg.r0)*(1-Math.pow(1-k,2)),0,TAU);ctx.stroke();}
  for(var j=0;j<particles.length;j++){var p=particles[j];var a=Math.max(0,p.life/p.max);ctx.fillStyle='rgba(255,214,120,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,TAU);ctx.fill();}
  requestAnimationFrame(drawFrame);}

/* ---- input: nearest city within a small radius (so close cities stay tappable) ---- */
function hit(x,y,type){var R=(type==='mouse'||!type)?30:42,best=null,bd=R;for(var i=0;i<S.cities.length;i++){var c=S.cities[i];var d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;best=c.c.id;}}return best;}
canvas.addEventListener('pointermove',function(e){if(S.screen!=='play'||e.pointerType==='touch')return;S.hoverId=hit(e.clientX,e.clientY,e.pointerType);});
addEventListener('pointerdown',function(e){audio.unlock();if(S.screen==='play'&&e.target===canvas){S.pressedId=hit(e.clientX,e.clientY,e.pointerType);}});
addEventListener('pointercancel',function(){S.pressedId=null;});
addEventListener('pointerup',function(e){S.pressedId=null;if(S.screen!=='play'||e.target!==canvas)return;var id=hit(e.clientX,e.clientY,e.pointerType);if(id)tapCity(id);});

/* ---- buttons ---- */
document.body.addEventListener('click',function(e){var t=e.target;var bt=t.closest?t.closest('button'):null;var bid=bt?bt.id:'';
  if(bid==='b-play'){var rid=resumeRegion();if(!rid){enterAtlas();return;}var fr0=findRegion(rid);S.contId=fr0.continent.id;S.regId=rid;enterPlay();return;}
  if(bid==='b-atlas'){enterAtlas();return;}
  if(bid==='b-credits'){enterCredits();return;}
  if(bid==='b-gotit'){closeRule();return;}
  if(bid==='b-rules'){if(S.screen==='play'&&!S.busy)ruleHelp();return;}
  if(bid==='b-retry'){S.regId=S.card.reg;S.save.partial[S.regId]=[];S.save.hints[S.regId]=0;enterPlay();return;}
  if(bid==='b-sound'){S.save.sound=!S.save.sound;audio.setMuted(!S.save.sound);saveS(S.save);enterTitle();return;}
  if(bid==='b-reset'){if(!S.resetArm){S.resetArm=true;bt.textContent='Tap again to erase all progress';return;}S.save=fresh();saveS(S.save);enterTitle();return;}
  if(bid==='b-close'){enterTitle();return;}
  if(bid==='b-next'){nextFromCard();return;}
  if(bid==='b-nextc'){nextContinent();return;}
  if(bid==='b-again'){S.save=fresh();saveS(S.save);enterTitle();return;}
  if(bid==='b-undo'){undoCity();return;}
  if(bid==='b-restart'){restartRegion();return;}
  if(bid==='b-hint'){nextHint();return;}
  if(bid==='b-menu'){enterTitle();return;}
  if(bid.indexOf('b-con:')===0){var cc=bid.slice(6);var f=findContinent(cc);if(f){S.contId=cc;S.regId=f.regions[0].id;S.save.currentRegion=f.regions[0].id;S.save.currentContinent=cc;saveS(S.save);enterContinentOverlay(cc);}return;}
  var cell=t.closest?t.closest('.regcell'):null;if(cell&&cell.dataset.id){var id=cell.dataset.id;var fr=findRegion(id);
    var ci=DATA.map(function(c){return c.id;}).indexOf(fr.continent.id);var ri=fr.continent.regions.map(function(r){return r.id;}).indexOf(id);
    if(regionUnlocked(S.save,ci,ri)){S.contId=fr.continent.id;S.regId=id;enterPlay();}return;}});

/* ---- boot ---- */
enterTitle();
document.addEventListener('pointerdown',function(){audio.unlock();},{once:true});
requestAnimationFrame(drawFrame);

</script>
</body>
