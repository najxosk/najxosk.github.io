<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>RESONANCE <span>CHESS</span></h1>
      <button id="level-label" class="level-btn" type="button" aria-haspopup="dialog">Level 01 · Normal</button>
    </div>
    <div class="top-btns">
      <button id="btn-hub" class="icon-btn" type="button" data-i18n-aria="menu" aria-haspopup="dialog">★</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="Sound on" aria-pressed="true">♪</button>
      <button id="btn-help" class="icon-btn" type="button" data-i18n-aria="rulesAria" aria-haspopup="dialog">?</button>
      <button id="btn-menu" class="icon-btn" type="button" data-i18n-aria="settings" aria-haspopup="dialog">⚙</button>
    </div>
  </header>

  <section class="hud" data-i18n-aria="gameStatus">
    <div class="hud-row">
      <span id="turn-chip" class="chip you" role="status" aria-live="polite">Your move</span>
      <span id="echo-state" class="echo-state"></span>
      <span class="meta"><span id="move-count">Moves: 0</span> · <span data-i18n="board">board</span> <span id="board-size">6×6</span></span>
    </div>
    <div class="hud-row caps" data-i18n-aria="capsAria">
      <span class="cap-label"><span data-i18n="captured">Captured</span> <b id="enemy-left">0/6</b></span><span id="cap-player" class="cap-list"></span>
      <span class="cap-label lost" data-i18n="lost">Lost</span><span id="cap-enemy" class="cap-list"></span>
    </div>
  </section>

  <main class="stage">
    <div class="board-frame">
      <div id="board" class="board" role="group" data-i18n-aria="boardAria"></div>
      <div id="echo-overlay" class="echo-overlay" hidden role="button" tabindex="0" data-i18n-aria="echoAria">
        <div class="echo-banner"><svg width="54" height="54" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5a11 11 0 1 1-10.4 7.4" fill="none" stroke="#9b7bff" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="4.2" fill="#4cc3ff"/></svg>
          <strong>ECHO</strong><span data-i18n="echoBanner"></span>
          <div class="echo-bar"><i id="echo-progress"></i></div>
        </div>
      </div>
    </div>
    <aside class="side">
      <div id="bench-wrap" class="bench-wrap">
        <div class="bench-title" data-i18n="reserve"></div>
        <div id="bench-hint" class="bench-hint" aria-live="polite"></div>
        <div id="bench" class="bench" role="group" data-i18n-aria="reserveAria"></div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <nav class="actions">
        <button id="btn-undo" type="button" class="btn" data-i18n="undo"></button>
        <button id="btn-new" type="button" class="btn" data-i18n="newGame"></button>
      </nav>
    </aside>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <div id="dlg-help" class="dialog" hidden role="dialog" aria-modal="true" data-i18n-aria="rules">
    <div class="card">
      <div id="help-body" class="help"></div>
      <div class="row">
        <button id="btn-tutorial" type="button" class="btn" data-i18n="showTutorial"></button>
        <button type="button" class="btn primary" data-close data-i18n="gotIt"></button>
      </div>
    </div>
  </div>

  <div id="dlg-hub" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="hub-title">
    <div class="card hub-card">
      <h2 id="hub-title" data-i18n="menu"></h2>
      <section class="hub-sec">
        <div class="hub-head"><h3 data-i18n="campaignMap"></h3><span id="hub-stars" class="hub-stars"></span></div>
        <p class="small" id="hub-chapter"></p>
        <div id="hub-levels" class="levels"></div>
        <div id="hub-level-info" class="level-info"></div>
      </section>
      <section class="hub-sec">
        <div class="hub-head"><h3 id="hub-daily-title"></h3><span id="hub-daily-state" class="hub-tag"></span></div>
        <p class="small" id="hub-daily-info"></p>
        <p class="small" id="hub-streak"></p>
        <button id="hub-daily-play" type="button" class="btn primary"></button>
      </section>
      <section class="hub-sec">
        <h3 id="hub-free-title"></h3>
        <p class="small" id="hub-free-info"></p>
        <div class="row">
          <button id="hub-free" type="button" class="btn"></button>
          <button id="hub-settings" type="button" class="btn"></button>
        </div>
      </section>
      <div class="row">
        <button id="hub-ach" type="button" class="btn"></button>
        <button id="hub-stats" type="button" class="btn"></button>
      </div>
      <div class="lang-switch" role="group" data-i18n-aria="language">
        <button type="button" class="lang-btn" data-lang="en">English</button><button type="button" class="lang-btn" data-lang="sk">Slovenčina</button>
      </div>
      <button type="button" class="btn plain" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="dlg-ach" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="ach-title">
    <div class="card">
      <h2 id="ach-title" data-i18n="achievements"></h2>
      <p class="small" id="ach-count"></p>
      <ul id="ach-list" class="ach-list"></ul>
      <button type="button" class="btn primary" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="dlg-menu" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="card">
      <h2 id="menu-title" data-i18n="settings"></h2>
      <label class="field"><span data-i18n="language"></span>
        <select id="opt-lang"><option value="en">English</option><option value="sk">Slovenčina</option></select>
      </label>
      <label class="field"><span data-i18n="level"></span>
        <select id="opt-seed"><option value="0" data-i18n="seed0"></option><option value="1" data-i18n="seed1"></option></select>
      </label>
      <fieldset class="field seg-field">
        <legend data-i18n="difficulty"></legend>
        <div id="opt-ai" class="seg" role="radiogroup" data-i18n-aria="difficultyAria">
          <label><input type="radio" name="opt-ai" value="basic"><span data-i18n="basic"></span></label>
          <label><input type="radio" name="opt-ai" value="normal"><span data-i18n="normal"></span></label>
          <label><input type="radio" name="opt-ai" value="tactic"><span data-i18n="tactic"></span></label>
        </div>
        <small id="opt-ai-info" class="seg-info"></small>
      </fieldset>
      <label class="check"><input id="opt-sound" type="checkbox"> <span data-i18n="sound"></span></label>
      <label class="check"><input id="opt-haptics" type="checkbox"> <span data-i18n="haptics"></span></label>
      <label class="check"><input id="opt-fast" type="checkbox"> <span data-i18n="fast"></span></label>
      <h3 data-i18n="yourResults"></h3>
      <ul id="progress-list" class="progress"></ul>
      <div class="row">
        <button id="menu-stats" type="button" class="btn" data-i18n="statsRecords"></button>
        <button id="menu-apply" type="button" class="btn primary" data-i18n="save"></button>
      </div>
      <button type="button" class="btn plain" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="dlg-result" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="res-title" aria-describedby="res-text">
    <div class="card result">
      <div id="res-signal" class="res-signal" aria-hidden="true"></div>
      <h2 id="res-title"></h2>
      <div id="res-stars" class="res-stars" hidden></div>
      <p id="res-text"></p>
      <dl id="res-stats" class="stats-grid"></dl>
      <p id="res-best" class="res-best"></p>
      <div class="row">
        <button id="res-undo" type="button" class="btn" data-i18n="undoMove"></button>
        <button id="res-new" type="button" class="btn primary" data-i18n="playAgain"></button>
      </div>
      <button id="res-free" type="button" class="btn" hidden data-i18n="newGameBtn"></button>
      <button id="res-next" type="button" class="btn primary" hidden></button>
      <div class="row">
        <button id="res-stats-btn" type="button" class="btn plain" data-i18n="statistics"></button>
        <button id="res-hub" type="button" class="btn plain" data-i18n="playMenu"></button>
        <button type="button" class="btn plain" data-close data-i18n="viewBoard"></button>
      </div>
    </div>
  </div>

  <div id="dlg-stats" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="stats-title">
    <div class="card stats-card">
      <h2 id="stats-title" data-i18n="statistics"></h2>
      <div class="field">
        <label for="stats-scope" data-i18n="recordsFor"></label>

<h2>How to play RESONANCE CHESS</h2>
<p class="lead">You play the <b>Hulaxy</b> (light pieces with a blue glow), the opponent plays the <b>Neid</b> (dark violet pieces with a hollow core).</p>
<ol>
  <li><b>6\xD76 board.</b> Pieces move as in classic chess \u2013 no castling, no en passant, pawns always move one square. A pawn reaching the last rank becomes a queen.</li>
  <li><b>The opponent starts with all pieces on the board.</b> You start with an empty board and a reserve (in free play and the campaign: king, queen, rook, bishop, knight, pawn).</li>
  <li><b>Your turn: deploy OR move.</b> On every turn you either move a piece on the board, or place one reserve piece on a free square in ranks 1\u20133 \u2013 the new piece then <b>makes its first move</b> (deploy + that move = one turn). With no piece on the board you must deploy.</li>
  <li><b>After each of your turns</b> the opponent makes one move (or deploys from its own reserve, if it has one).</li>
  <li><b>Echo.</b> When one of your living pieces dies, the whole history is replayed from the start to the moment of death. Then the game continues. The dead piece remains as a <i>translucent memory</i> \u2013 you can no longer deploy on its square. On the turn right after an Echo you cannot deploy on a square from which you could checkmate immediately.</li>
  <li><b>Win:</b> capture all enemy pieces. The king is not a special target and checkmate does not end the game.<br><b>Loss:</b> no living piece and an empty reserve.</li>
  <li><b>Stalemate = loss:</b> a side to move that has <b>no legal move and no legal deployment loses</b> \u2013 you and the opponent alike, in check or not. There is no passing.</li>
  <li><b>Duel of two bodies:</b> with 1 piece against 1 and an empty reserve, the board shrinks by one rank and file every 5 moves (6\u21925\u21924\u21923\u21922). A piece outside the board falls.</li>
  <li>The same position repeated 3 times with an empty reserve = draw.</li>
</ol>
<p class="legend"><span class="lg mv"></span> move <span class="lg cap"></span> capture <span class="lg dep"></span> deploy <span class="lg forb"></span> forbidden (D.1)</p>
<p class="small">The game is saved automatically in this browser. \u201CUndo\u201D takes back your last move and the opponent\u2019s reply. Campaign, daily puzzle and achievements are in the play menu (tap the level name). Language, difficulty, sound and vibration are in \u2699 Settings.</p>

"Pozrie\u0165 dosku",recordsFor:"Rekordy pre",games:"Hry",statsNote:"\u0164ahy = tvoje \u0165ahy (nasadenie a jeho prv\xFD \u0165ah sa r\xE1taj\xFA ako jeden). V\xFDhra jednou fig\xFArkou = po\u010Das celej hry nasaden\xE1 presne jedna fig\xFArka. Straty = tvoje zajat\xE9 fig\xFArky alebo fig\xFArky, ktor\xE9 spadli z dosky. R\xE1taj\xFA sa len dokon\u010Den\xE9 v\xFDhry vo vo\u013Enej hre.",resetStats:"Vymaza\u0165 \u0161tatistiky",skip:"Presko\u010Di\u0165",back:"Sp\xE4\u0165",next:"\u010Ealej",startPlaying:"Za\u010Da\u0165 hra\u0165",playMenu:"Menu",menu:"Hern\xE9 menu",achievements:"\xDAspechy",campaignMap:"Kampa\u0148"},helpHtml:`
<h2>Ako hra\u0165 RESONANCE CHESS</h2>
<p class="lead">Hr\xE1\u0161 za <b>Hulaxy</b> (svetl\xE9 fig\xFArky s modrou \u017Eiarou), s\xFAper hr\xE1 za <b>Neid</b> (tmavofialov\xE9 fig\xFArky s dut\xFDm jadrom).</p>
<ol>
  <li><b>Doska 6\xD76.</b> Fig\xFArky sa pohybuj\xFA ako v klasickom \u0161achu \u2013 bez ro\u0161\xE1dy, bez brania mimochodom, pe\u0161iak ide v\u017Edy o jedno pole. Pe\u0161iak na poslednom rade sa men\xED na d\xE1mu.</li>
  <li><b>S\xFAper za\u010D\xEDna so v\u0161etk\xFDmi fig\xFArkami na doske.</b> Ty za\u010D\xEDna\u0161 s pr\xE1zdnou doskou a so z\xE1sobou (vo vo\u013Enej hre a v kampani: kr\xE1\u013E, d\xE1ma, ve\u017Ea, strelec, jazdec, pe\u0161iak).</li>
  <li><b>Tvoj \u0165ah: nasadi\u0165 ALEBO \u0165aha\u0165.</b> V ka\u017Edom \u0165ahu bu\u010F \u0165ah\xE1\u0161 fig\xFArkou na doske, alebo polo\u017E\xED\u0161 jednu fig\xFArku zo z\xE1soby na vo\u013En\xE9 pole v radoch 1\u20133 \u2013 nov\xE1 fig\xFArka potom <b>hne\u010F urob\xED prv\xFD \u0165ah</b> (nasadenie + tento \u0165ah = jeden \u0165ah). Ak na doske nem\xE1\u0161 \u017Eiadnu fig\xFArku, mus\xED\u0161 nasadi\u0165.</li>
  <li><b>Po ka\u017Edom tvojom \u0165ahu</b> urob\xED jeden \u0165ah s\xFAper (alebo nasad\xED zo svojej z\xE1soby, ak nejak\xFA m\xE1).</li>
  <li><b>Ozvena.</b> Ke\u010F padne tvoja \u017Eiv\xE1 fig\xFArka, prehr\xE1 sa cel\xE1 hist\xF3ria od za\u010Diatku a\u017E po okamih smrti. Potom hra pokra\u010Duje. M\u0155tva fig\xFArka ostane ako <i>priesvitn\xE1 spomienka</i> \u2013 na jej pole u\u017E nem\xF4\u017Ee\u0161 nasadi\u0165. V \u0165ahu hne\u010F po Ozvene nem\xF4\u017Ee\u0161 nasadi\u0165 na pole, z ktor\xE9ho by si hne\u010F dal mat.</li>
  <li><b>V\xFDhra:</b> zajmi v\u0161etky s\xFAperove fig\xFArky. Kr\xE1\u013E nie je zvl\xE1\u0161tny cie\u013E a mat hru nekon\u010D\xED.<br><b>Prehra:</b> \u017Eiadna \u017Eiv\xE1 fig\xFArka a pr\xE1zdna z\xE1soba.</li>
  <li><b>Pat = prehra:</b> strana na \u0165ahu, ktor\xE1 <b>nem\xE1 \u017Eiadny \u0165ah ani mo\u017En\xE9 nasadenie, prehr\xE1va</b> \u2013 plat\xED pre teba aj pre s\xFApera, v \u0161achu aj mimo neho. Pasova\u0165 sa ned\xE1.</li>
  <li><b>S\xFAboj dvoch tiel:</b> pri 1 fig\xFArke proti 1 a pr\xE1zdnej z\xE1sobe sa doska ka\u017Ed\xFDch 5 \u0165ahov zmen\u0161\xED o jeden rad a st\u013Apec (6\u21925\u21924\u21923\u21922). Fig\xFArka mimo dosky pad\xE1.</li>
  <li>T\xE1 ist\xE1 poz\xEDcia zopakovan\xE1 3-kr\xE1t pri pr\xE1zdnej z\xE1sobe = rem\xEDza.</li>
</ol>
<p class="legend"><span class="lg mv"></span> \u0165ah <span class="lg cap"></span> zajatie <span class="lg dep"></span> nasadenie <span class="lg forb"></span> zak\xE1zan\xE9 (D.1)</p>
<p class="small">Hra sa uklad\xE1 automaticky v tomto prehliada\u010Di. \u201ESp\xE4\u0165\u201C vr\xE1ti tvoj posledn\xFD \u0165ah aj odpove\u010F s\xFApera. Kampa\u0148, denn\xE1 \xFAloha a \xFAspechy s\xFA v hernom menu (\u0165ukni na n\xE1zov \xFArovne). Jazyk, obtia\u017Enos\u0165, zvuk a vibr\xE1cie s\xFA v \u2699 Nastaveniach.</p>
