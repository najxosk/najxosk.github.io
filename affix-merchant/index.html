<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b24">
<title>Affix Merchant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0e0c0a;color:#e2d2a8;font-family:Georgia,'Times New Roman',serif;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% -10%,#3a2d1e,#0e0c0a 65%)}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{flex:none;background:linear-gradient(#211a13,#15110d);border-bottom:2px solid #5a4630;padding:5px 8px 4px;box-shadow:0 3px 10px #000a;padding-top:max(5px,env(safe-area-inset-top))}
.row{display:flex;align-items:center;gap:6px}
#gold{font-size:20px;font-weight:bold;color:#ffd76a;text-shadow:0 0 8px #b8862f88;min-width:84px}
#rep{flex:1;font-size:12px}
.bar{height:6px;background:#2b2219;border:1px solid #4a3b28;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8862f,#ffd76a);transition:width .6s}
button{font-family:inherit;color:#f0e2bb;background:linear-gradient(#4d3d29,#2a2117);border:1px solid #8a6d3e;border-radius:9px;padding:8px 10px;font-size:15px;min-height:42px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff22,0 2px 4px #0008;touch-action:manipulation}

button.sm{min-height:34px;padding:4px 8px;font-size:13px}
button.gold{background:linear-gradient(#a8812f,#5e4518);border-color:#ffd76a;color:#fff6d8}

#ticker .hot{animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{color:#fff2a8;text-shadow:0 0 8px #ff7b00}}
main{flex:1;min-height:0;overflow:auto;padding:6px 8px;-webkit-overflow-scrolling:touch}

h2{font-size:16px;margin:4px 0 6px;color:#e8c77a}
.panel{background:linear-gradient(#231c15,#17130f);border:1px solid #4a3b28;border-radius:10px;padding:8px;margin-bottom:8px}
.card{position:relative;background:linear-gradient(160deg,#221b14,#0f0c0a 60%,#1a140f);border:2px solid var(--rc);border-radius:12px;padding:8px;box-shadow:0 0 14px -3px var(--rc),inset 0 0 24px #000}
.card:before,.card:after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--rc);opacity:.8;pointer-events:none}
.card:before{top:3px;left:3px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}.card:after{bottom:3px;right:3px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.card.r3{animation:glow 2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 26px 2px var(--rc),inset 0 0 24px #000}}
.ch{display:flex;gap:8px;align-items:center}
.ic{width:46px;height:46px;flex:none;border:1px solid var(--rc);border-radius:9px;background:radial-gradient(circle at 50% 40%,#3a3024,#0d0b09)}
.ic svg{width:100%;height:100%}
.nm{font-size:16px;font-weight:bold;color:var(--rc);text-shadow:0 0 6px #000}
.sub{font-size:11px;opacity:.85}
.tagx{color:#ff5a4a;font-weight:bold}
.sb{position:relative;height:22px;margin:6px 0 4px;background:#1a120c;border:1px solid #6a5232;border-radius:11px;overflow:hidden}
.sb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f7fd0,#6fd0ff);transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px #6fd0ff88}

.affs{overflow:auto;min-height:0}

.t1{color:#ff8c1a;text-shadow:0 0 6px #ff6a00}.t2{color:#c86bff}.t3{color:#4aa3ff}.t4{color:#5fd35f}.t5{color:#bbb}

.good{color:#6be36b}.warn{color:#ffb84a}.bad{color:#ff5a4a}.pos{color:#6be36b}.neg{color:#ff6a5a}
.flex{display:flex;gap:6px;align-items:center}.grow{flex:1}
.ws{height:100%;display:flex;flex-direction:column;gap:5px}

.sellrow{flex:none;display:grid;grid-template-columns:1.6fr 1fr;gap:5px}

.list{flex:1;min-height:0;overflow:auto;padding-right:2px}

.mini .af{font-size:12px;padding:2px 6px}

.hidden{display:none!important}

.shake{animation:shake .4s}

.big{font-size:22px;text-align:center;color:#ff8c1a;text-shadow:0 0 10px #ff6a00}

.q{display:flex;gap:6px;align-items:center;margin:2px 0;font-size:12.5px}.q button.sm{min-height:30px}
.cx{display:grid;grid-template-columns:1.55fr repeat(5,1fr) 1.2fr;gap:2px;font-size:10.5px;align-items:center}

@media (max-height:700px){#gold{font-size:17px}.ab{height:48px}.ab .ai{font-size:17px}.af{font-size:12.5px;padding:3px 6px}.ic{width:38px;height:38px}.nm{font-size:14px}.sb{height:18px;margin:4px 0 2px}.sb span{line-height:16px;font-size:12px}.sellrow button{min-height:44px}nav button{min-height:48px}nav button b{font-size:17px}.strip button{width:38px;height:38px}#hint{min-height:30px;font-size:11.5px}}
.ic{width:auto;height:auto;padding:1px}.ic canvas{display:block}
.card.el{box-shadow:0 0 16px -2px var(--ec),0 0 4px var(--rc),inset 0 0 26px #000;animation:elg 2.4s infinite alternate}

.ab .an{font-size:10px;white-space:normal;text-align:center;line-height:1.05;max-width:100%}

.arow{display:flex;gap:8px;align-items:center;text-align:left;min-height:56px;width:100%}.arow .ai{font-size:26px}.arow.dim{opacity:.55}
.strip button{width:40px;height:40px}.strip button small{display:block;font-size:9px}
.guide{position:relative;animation:gp 1s infinite!important;z-index:3}
@keyframes gp{50%{box-shadow:0 0 0 3px #ffd76a,0 0 18px #ffd76a}}
.guide::after{content:'👆';position:absolute;right:2px;bottom:-12px;font-size:22px;animation:bob .7s infinite alternate;pointer-events:none;filter:drop-shadow(0 0 4px #000)}
@keyframes bob{to{transform:translateY(-6px)}}
.gbar{flex:none;font-size:12.5px;padding:5px 8px;border:1px solid #ffd76a;border-radius:8px;background:#3a2e1a;color:#ffd76a}

.sellbox{width:100%;max-width:420px;max-height:96dvh;overflow:auto;display:flex;flex-direction:column;gap:5px}
.sbtitle{text-align:center;font-size:22px;color:#ffd76a;text-shadow:0 0 12px #ff9a3c;letter-spacing:2px}
.buyer{display:flex;align-items:center;gap:8px;justify-content:center}.buyer canvas{width:72px;height:72px;border-radius:50%;border:2px solid #8a6d3e;box-shadow:0 0 12px #000}

.bd{background:#0008;border:1px solid #4a3b28;border-radius:8px;padding:6px 10px;font-size:13px}
.bdl{display:flex;justify-content:space-between;opacity:0;transform:translateX(-10px);transition:.25s}.bdl.on{opacity:1;transform:none}

.sprofit{text-align:center;font-size:18px;min-height:24px}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.skc{text-align:center;margin:0}.skc.on{border-color:#ffd76a;box-shadow:0 0 10px #ffd76a66}.skc canvas{display:block;margin:0 auto}
html,body{overflow:hidden}
nav button{font-size:9.5px}
.agrid{grid-template-columns:repeat(5,1fr)}

.card.corr{border-color:#a040ff;--rc:#b060ff;box-shadow:0 0 18px #8a2cff,inset 0 0 30px #2a0040;animation:corr 2s infinite alternate}

tut:[`<h2>⚒️ Ako hrať (1/3)</h2><p><b>Tvoje remeslo:</b> kupuj zbrane na <b>Trhu</b>, vylepšuj ich v <b>Dielni</b> a predávaj so ziskom alebo ich odovzdaj zákazníkom v <b>Zákazkách</b>.</p><p><b>Afixy:</b> max. <b>3 prefixy</b> (poškodenie) a <b>3 sufixy</b> (rýchlosť, kritické zásahy, odolnosti). Tiery <span class="t5">T5</span> → <span class="t4">T4</span> → <span class="t3">T3</span> → <span class="t2">T2</span> → <span class="t1">T1</span> (najlepší). <b>Úroveň predmetu (ilvl)</b> určuje najlepší možný tier.</p>`,
 `<h2>⚖ Stabilita a úpravy (2/3)</h2><p><b>Stabilita je rozpočet predmetu.</b> Každá úprava ju míňa (modré číslo na tlačidle). Na 0 je predmet <b>zapečatený</b>. Zvyšná stabilita zvyšuje predajnú cenu a niektorí zákazníci ju vyžadujú.</p><p>💠 pridá afix · 🎲 prehodí hodnoty · 🌀 zruší náhodný · 🧪 pridá zvolený afix · 🔆 obnoví stabilitu · 🔮 znamenia. Ťukni na afix na karte: 🔥 <b>Vyhňa</b> zvýši tier (riziko prasknutia), 🔁 výmena, ✂️ vystrihnutie, 🔒 zámok.</p><p><b>♻ Rozober</b> nepotrebné predmety na <b>🔆 uhlíky</b> – nedajú sa kúpiť.</p>`,
 `<h2>👑 Rast obchodu (3/3)</h2><p><b>⭐ Reputácia</b> odomyká nové zbrane a vyššie úrovne predmetov. <b>⬆️ Rozvoj</b> vylepšuje obchod.</p><p><b>📖 Kódex:</b> objav všetkých 5 tierov afixu a získaj trvalý bonus.</p><p><b>🌑 Korupcia:</b> riskantná jednorazová stávka – veľké zlepšenie alebo zničenie.</p><p><b>👑 Prestíž:</b> dosiahni cieľ, predaj obchod a získaj Majstrovské body na trvalé vylepšenia.</p><p class="muted">Podrž ľubovoľné tlačidlo = vysvetlenie.</p>`]},
