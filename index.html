<style>
:root{
  --bg:#0a0e1a; --card:#111a30; --card2:#0d1426; --border:#1e4a8a; --text:#d6e4ff; --dim:#7f93b8;
  --neon:#3ad0ff; --orange:#ffb347; --axo:#22d3ee; --echo:#b388ff; --music:#39ff88; --grey:#8a97b0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  background-image:
    linear-gradient(rgba(58,208,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(58,208,255,.045) 1px,transparent 1px),
    radial-gradient(ellipse at top,rgba(30,74,138,.35),transparent 60%);
  background-size:28px 28px,28px 28px,100% 100%;
  background-attachment:fixed;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);opacity:.35}
.wrap{max-width:480px;margin:0 auto;padding:0 12px calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  margin:0 -12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
h1{font-family:Orbitron,Inter,sans-serif;font-weight:800;font-size:18px;letter-spacing:1.5px;margin:0;color:var(--neon);
  text-shadow:0 0 8px rgba(58,208,255,.6);flex:1;line-height:1.2}
h1 small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0;color:var(--dim);text-shadow:none;margin-top:2px}
.refresh{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--neon);
  font-size:24px;cursor:pointer;box-shadow:0 0 10px rgba(58,208,255,.25);display:flex;align-items:center;justify-content:center}
.refresh.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:999px;padding:9px 15px;
  font:600 14px Inter,sans-serif;cursor:pointer;min-height:40px}
.chip.on{background:var(--neon);color:#04121f;border-color:var(--neon);box-shadow:0 0 12px rgba(58,208,255,.55)}
h2{font-family:Orbitron,Inter,sans-serif;font-weight:600;font-size:14px;letter-spacing:1.2px;color:var(--neon);text-transform:uppercase;
  margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
h2 .n{font-family:Inter,sans-serif;font-size:12px;color:var(--bg);background:var(--neon);border-radius:999px;padding:1px 8px;letter-spacing:0}
h2.toggle{cursor:pointer;user-select:none;padding:8px 0;margin-top:14px}
h2.toggle::after{content:"▸";margin-left:auto;color:var(--dim);font-size:16px;transition:transform .2s}
h2.toggle.open::after{transform:rotate(90deg)}
h2.orange{color:var(--orange)} h2.orange .n{background:var(--orange)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:0 0 10px;
  box-shadow:0 0 0 1px rgba(58,208,255,.04),0 0 14px rgba(58,208,255,.10)}
.card.past{opacity:.45}
.card.wait{border-color:#8a5a1e;box-shadow:0 0 14px rgba(255,179,71,.14)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pchip{font:700 11px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:2px 8px;border:1px solid currentColor}
.p-axo{color:var(--axo);background:rgba(34,211,238,.08)} .p-echo{color:var(--echo);background:rgba(179,136,255,.08)}
.p-music{color:var(--music);background:rgba(57,255,136,.07)} .p-other{color:var(--grey);background:rgba(138,151,176,.08)}
.title{font-weight:600;font-size:16.5px;color:#eef4ff}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:var(--dim)}
.meta b{color:var(--text);font-weight:500}
.note{margin-top:8px;font-size:14px;color:#b8c8e8;border-top:1px dashed #1e3a66;padding-top:8px;word-break:break-word}
.note.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.note.clamp::before{content:"📝 "}
.note a,.card a{color:var(--neon)}
.hidden{display:none}
.datehead{font:600 13px Inter,sans-serif;color:var(--dim);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.8px}
.datehead.today{color:var(--orange)}
.time{font-family:Orbitron,monospace;font-size:15px;color:var(--neon);min-width:56px}
.row{display:flex;gap:12px;align-items:flex-start}
.total{text-align:center;padding:16px}
.total .big{font-family:Orbitron,sans-serif;font-size:30px;color:var(--neon);text-shadow:0 0 10px rgba(58,208,255,.5)}
.unk{color:#56688c;font-style:italic}
.empty{color:var(--dim);text-align:center;padding:20px;font-size:14px}
.msg{background:#2a1520;border:1px solid #8a2a4a;color:#ffd0dc;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.msg.info{background:#10223d;border-color:var(--border);color:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,13,24,.96);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.5)}
nav .in{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:9px 2px 10px;font:600 12px Inter,sans-serif;cursor:pointer;min-height:62px}
nav button .ic{display:block;font-size:22px;line-height:1.2;filter:grayscale(.6)}
nav button.on{color:var(--neon);text-shadow:0 0 8px rgba(58,208,255,.6)}
nav button.on .ic{filter:none}
.foot{text-align:center;margin:26px 0 10px;font-size:13px}
.foot a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>◆ PREHĽAD<small id="upd">Načítavam…</small></h1>
    <button class="refresh" id="btnRefresh" aria-label="Obnoviť"><span>↻</span></button>
  </header>
  <div id="status"></div>
  <main id="view"></main>
  <div class="foot"><a href="https://docs.google.com/spreadsheets/d/1lAztz4HyTyZ8hnA80io7RKVfYXI7S3DDoSFvVupG6n4/edit" target="_blank" rel="noopener">Otvoriť Google tabuľku ↗</a></div>
</div>
<nav><div class="in">
  <button data-v="ulohy"><span class="ic">⚡</span>Úlohy</button>
  <button data-v="kalendar"><span class="ic">📅</span>Kalendár</button>
  <button data-v="predplatne"><span class="ic">💳</span>Predplatné</button>
  <button data-v="boti"><span class="ic">🤖</span>Boti</button>
</div></nav>
<script>
(function(){
"use strict";
var SHEET_ID="1lAztz4HyTyZ8hnA80io7RKVfYXI7S3DDoSFvVupG6n4";
var TABS={kanban:["Kanban","A3:F300"],kalendar:["Kalendár","A3:E300"],predplatne:["Predplatné","A3:E300"],boti:["AI a boti","A3:D300"]};
var CACHE_KEY="prehlad_cache_v1";
var state={view:localStorage.getItem("prehlad_view")||"ulohy",filter:localStorage.getItem("prehlad_filter")||"all",data:null,updated:null,open:{}};
var DAYS=["Ne","Po","Ut","St","Št","Pi","So"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&","<":"<",">":">",'"':""","'":"&#39;"}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:)!?])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function unk(s){s=String(s||"").trim();return !s||/^\?/.test(s)}
function val(s){return unk(s)?'<span class="unk">doplní Stefan</span>':esc(s)}
function pad(n){return(n<10?"0":"")+n}

/* ---- loading via JSONP (works from any origin) ---- */
var cbn=0;
function loadTab(name,range){
  return new Promise(function(res,rej){
    var cb="__gv"+(++cbn)+"_"+Date.now(), s=document.createElement("script"), done=false;
    var t=setTimeout(function(){fin();rej(new Error("timeout"))},15000);
    function fin(){done=true;clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s)}
    window[cb]=function(r){if(done)return;fin();
      if(!r||r.status==="error"){rej(new Error((r&&r.errors&&r.errors[0]&&r.errors[0].detailed_message)||"chyba"));return}
      var rows=(r.table&&r.table.rows)||[];
      res(rows.map(function(row){return(row.c||[]).map(function(c){
        if(!c)return"";var v=c.v;
        if(c.f!=null)return{f:String(c.f),v:v};
        return v==null?"":(typeof v==="number"||typeof v==="string"&&/^Date\(/.test(v)?{f:String(v),v:v}:String(v));
      })}));
    };
    s.onerror=function(){if(done)return;fin();rej(new Error("prístup"))};
    s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:"+cb+
      "&headers=0&sheet="+encodeURIComponent(name)+"&range="+range+"&_="+Date.now();
    document.head.appendChild(s);
  });
}
function txt(c){return c&&typeof c==="object"?c.f:(c==null?"":String(c))}
function parseDate(c){
  if(c&&typeof c==="object"&&typeof c.v==="string"){var m=/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/.exec(c.v);
    if(m)return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0))}
  var s=txt(c).trim(),m2;
  if((m2=/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2}))?/.exec(s)))return new Date(+m2[1],m2[2]-1,+m2[3],+(m2[4]||0),+(m2[5]||0));
  if((m2=/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(s)))return new Date(+m2[3],m2[2]-1,+m2[1],+(m2[4]||0),+(m2[5]||0));
  return null;
}
function hasTime(c){var s=txt(c);return /\d{1,2}:\d{2}/.test(s)||(c&&typeof c==="object"&&/^Date\(\d+,\d+,\d+,\d+/.test(String(c.v)))}
function fmtDate(d,withTime){if(!d)return"";var s=DAYS[d.getDay()]+" "+d.getDate()+". "+(d.getMonth()+1)+".";
  if(d.getFullYear()!==new Date().getFullYear())s+=" "+d.getFullYear();
  if(withTime)s+=" "+pad(d.getHours())+":"+pad(d.getMinutes());return s}

function normalize(raw){
  function rows(a,n){return(a||[]).map(function(r){var o=[];for(var i=0;i<n;i++)o.push(r[i]==null?"":r[i]);return o})
    .filter(function(r){return r.some(function(c){return txt(c).trim()!==""})})}
  return{kanban:rows(raw.kanban,6),kalendar:rows(raw.kalendar,5),predplatne:rows(raw.predplatne,5),boti:rows(raw.boti,4)};
}

function refresh(){
  var btn=document.getElementById("btnRefresh");btn.classList.add("spin");
  var keys=Object.keys(TABS);
  Promise.all(keys.map(function(k){return loadTab(TABS[k][0],TABS[k][1])})).then(function(res){
    var raw={};keys.forEach(function(k,i){raw[k]=res[i]});
    state.data=normalize(raw);state.updated=new Date();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:state.updated.getTime(),d:state.data}))}catch(e){}
    setStatus("");render();
  }).catch(function(e){
    var cached=!!state.data;state.failed=true;
    setStatus('<div class="msg">⚠️ Nepodarilo sa načítať živé dáta'+(cached?' — zobrazujem poslednú uloženú verziu.':'.')+
      '<br><small>Skontroluj internet. Ak to trvá: tabuľka musí byť zdieľaná <b>Ktokoľvek s odkazom → Čitateľ</b> (v Google Tabuľke: Zdieľať → Všeobecný prístup).</small></div>');
    render();
  }).then(function(){btn.classList.remove("spin")});
}
function setStatus(h){document.getElementById("status").innerHTML=h}

/* ---- views ---- */
function projClass(p){p=String(p||"").toLowerCase();
  if(p.indexOf("axo")>=0)return"p-axo";if(p.indexOf("echo")>=0)return"p-echo";if(p.indexOf("music")>=0)return"p-music";return"p-other"}
function pchip(p){return unk(p)?"":'<span class="pchip '+projClass(p)+'">'+esc(p)+'</span>'}
function matchFilter(p){if(state.filter==="all")return true;return String(p||"").toLowerCase().indexOf(state.filter.toLowerCase())>=0}
function chips(){var f=[["all","Všetko"],["AxoDose","AxoDose"],["EchoWorlds","EchoWorlds"],["MusicDose","MusicDose"]];
  return'<div class="chips">'+f.map(function(x){return'<button class="chip'+(state.filter===x[0]?" on":"")+'" data-f="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'}
function section(id,title,inner,count,collapsible,defOpen,cls){
  var open=state.open[id]!==undefined?state.open[id]:defOpen;
  return'<h2 class="'+(cls||"")+(collapsible?" toggle"+(open?" open":""):"")+'" '+(collapsible?'data-t="'+id+'"':"")+'>'+title+' <span class="n">'+count+'</span></h2>'+
    '<div'+(collapsible&&!open?' class="hidden"':"")+'>'+(inner||'<div class="empty">Nič tu nie je.</div>')+'</div>';
}
function taskCard(r,now){
  var proj=r[0],title=txt(r[1]),kto=txt(r[3]),term=r[4],note=txt(r[5]),d=parseDate(term),stav=txt(r[2]).toLowerCase();
  var past=stav.indexOf("napl")===0&&d&&d<now;
  var meta=[];if(!unk(kto))meta.push("<span>👤 <b>"+esc(kto)+"</b></span>");
  if(!unk(txt(term)))meta.push("<span>⏰ <b>"+(d?esc(fmtDate(d,hasTime(term))):esc(txt(term)))+"</b></span>");
  return'<div class="card'+(past?" past":"")+(stav.indexOf("čaká")===0?" wait":"")+'"><div class="top">'+pchip(proj)+'</div>'+
    '<div class="title">'+esc(title)+'</div>'+(meta.length?'<div class="meta">'+meta.join("")+'</div>':"")+
    (note.trim()&&!unk(note)?'<div class="note clamp">'+linkify(note)+'</div>':"")+'</div>';
}
function viewUlohy(){
  var now=new Date(),rows=state.data.kanban.filter(function(r){return matchFilter(txt(r[0]))});
  function by(prefix){return rows.filter(function(r){return txt(r[2]).trim().toLowerCase().indexOf(prefix)===0})}
  var cak=by("čaká"),nap=by("napl"),rob=by("robí"),ide=by("náp"),hot=by("hotov");
  var known=cak.concat(nap,rob,ide,hot),other=rows.filter(function(r){return known.indexOf(r)<0});
  nap.sort(function(a,b){var x=parseDate(a[4]),y=parseDate(b[4]);return(x?x.getTime():9e15)-(y?y.getTime():9e15)});
  function list(a){return a.map(function(r){return taskCard(r,now)}).join("")}
  var h=chips();
  h+=section("cak","🟠 Čaká na teba",list(cak),cak.length,false,true,"orange");
  h+=section("nap","📅 Naplánované",list(nap),nap.length,false,true);
  h+=section("rob","⚡ Robí sa",list(rob),rob.length,false,true);
  h+=section("ide","💡 Nápady",list(ide),ide.length,true,true);
  if(other.length)h+=section("oth","❔ Iné",list(other),other.length,true,true);
  h+=section("hot","✅ Hotovo",list(hot),hot.length,true,false);
  return h;
}
function viewKalendar(){
  var today=new Date();today.setHours(0,0,0,0);
  var items=state.data.kalendar.map(function(r){return{r:r,d:parseDate(r[0])}});
  items.sort(function(a,b){var x=a.d?a.d.getTime():9e15,y=b.d?b.d.getTime():9e15;if(x!==y)return x-y;return txt(a.r[1]).localeCompare(txt(b.r[1]))});
  var up=items.filter(function(i){return!i.d||i.d>=today}),past=items.filter(function(i){return i.d&&i.d<today}).reverse();
  function grp(list){var out="",last=null;list.forEach(function(i){
      var key=i.d?i.d.toDateString():"?";
      if(key!==last){last=key;var isT=i.d&&i.d.getTime()===today.getTime();
        out+='<div class="datehead'+(isT?" today":"")+'">'+(i.d?esc(fmtDate(i.d))+(isT?" · DNES":""):"Bez dátumu")+'</div>'}
      var r=i.r,t=txt(r[1]);
      out+='<div class="card"><div class="row"><div class="time">'+(unk(t)?"—":esc(t))+'</div><div style="flex:1">'+
        '<div class="title">'+linkify(txt(r[2]))+'</div><div class="meta">'+(unk(txt(r[3]))?"":"<span>📍 <b>"+esc(txt(r[3]))+"</b></span>")+
        (unk(txt(r[4]))?"":"<span>👤 <b>"+esc(txt(r[4]))+"</b></span>")+'</div></div></div></div>'});return out}
  return section("kup","📅 Nadchádzajúce",grp(up),up.length,false,true)+section("kpast","🕘 Minulé",grp(past),past.length,true,false);
}
function price(c){
  if(c&&typeof c==="object"&&typeof c.v==="number")return c.v;
  var s=txt(c).trim();if(!/^\d+(?:[.,]\d+)?\s*(?:€|eur|eur\.)?$/i.test(s))return null;return parseFloat(s.replace(",","."));
}
function money(n){return n.toFixed(2).replace(".",",")+" €"}
function viewPredplatne(){
  var rows=state.data.predplatne.filter(function(r){return!/^spolu/i.test(txt(r[0]).trim())});
  var sum=0,known=0;
  var cards=rows.map(function(r){var p=price(r[2]);if(p!=null){sum+=p;known++}
    return'<div class="card"><div class="top"><span class="title" style="flex:1">'+esc(txt(r[0]))+'</span>'+
      '<span class="time" style="text-align:right">'+(p!=null?esc(money(p)):'<span class="unk" style="font-family:Inter">? €</span>')+'</span></div>'+
      '<div class="meta">'+(unk(txt(r[1]))?"":"<span>🎯 <b>"+esc(txt(r[1]))+"</b></span>")+'<span>🔄 <b>'+val(txt(r[3]))+'</b></span></div>'+
      (txt(r[4]).trim()&&!unk(txt(r[4]))?'<div class="note">'+linkify(txt(r[4]))+'</div>':"")+'</div>'}).join("");
  var tot='<div class="card total"><div style="color:var(--dim);font-size:13px">SPOLU / MESIAC</div><div class="big">'+money(sum)+'</div>'+
    '<div style="color:var(--dim);font-size:13px">cena známa pri '+known+' z '+rows.length+' služieb</div></div>';
  return'<h2>💳 Predplatné <span class="n">'+rows.length+'</span></h2>'+tot+cards;
}
function viewBoti(){
  var rows=state.data.boti.filter(function(r){return matchFilter(txt(r[3]))||state.filter==="all"});
  var groups={},order=[];
  rows.forEach(function(r){var p=unk(txt(r[3]))?"Nezaradené":txt(r[3]).trim();if(!groups[p]){groups[p]=[];order.push(p)}groups[p].push(r)});
  var rank=function(p){var c=projClass(p);return c==="p-axo"?0:c==="p-echo"?1:c==="p-music"?2:p==="Nezaradené"?4:3};
  order.sort(function(a,b){return rank(a)-rank(b)});
  return chips()+order.map(function(p){
    return section("b_"+p,'<span class="pchip '+projClass(p)+'">'+esc(p)+'</span>',groups[p].map(function(r){
      return'<div class="card"><div class="title">🤖 '+esc(txt(r[0]))+'</div><div class="meta">'+
        (unk(txt(r[2]))?"":"<span>🎯 <b>"+esc(txt(r[2]))+"</b></span>")+'</div><div class="meta"><span>💻 <b>'+val(txt(r[1]))+'</b></span></div></div>'}).join(""),groups[p].length,false,true)
  }).join("")||'<div class="empty">Žiadni boti pre tento filter.</div>';
}
function render(){
  var v=document.getElementById("view");
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-v")===state.view)});
  document.getElementById("upd").textContent=state.updated?"Aktualizované: "+fmtDate(state.updated,true):(state.failed?"Nenačítané":"Načítavam…");
  if(!state.data){v.innerHTML='<div class="empty">'+(state.failed?"Zatiaľ žiadne dáta.":"Načítavam dáta z tabuľky…")+'</div>';return}
  v.innerHTML=state.view==="kalendar"?viewKalendar():state.view==="predplatne"?viewPredplatne():state.view==="boti"?viewBoti():viewUlohy();
}
document.addEventListener("click",function(e){
  var t=e.target;if(t.closest("a"))return;
  var nb=t.closest("nav button");if(nb){state.view=nb.getAttribute("data-v");localStorage.setItem("prehlad_view",state.view);render();window.scrollTo(0,0);return}
  var ch=t.closest(".chip");if(ch){state.filter=ch.getAttribute("data-f");localStorage.setItem("prehlad_filter",state.filter);render();return}
  var tg=t.closest("h2.toggle");if(tg){var id=tg.getAttribute("data-t");var body=tg.nextElementSibling;var open=body.classList.contains("hidden");
    state.open[id]=open;body.classList.toggle("hidden",!open);tg.classList.toggle("open",open);return}
  var n=t.closest(".note");if(n){n.classList.toggle("clamp");return}
  if(t.closest("#btnRefresh"))refresh();
});
try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(c&&c.d){state.data=c.d;state.updated=new Date(c.t)}}catch(e){}
render();refresh();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&(!state.updated||Date.now()-state.updated.getTime()>60000))refresh()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
