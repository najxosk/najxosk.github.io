<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Mail — the last dream train</title>
<style>
:root{color-scheme:dark;--ink:#eae0c8;--muted:#aaa995;--gold:#d4b779;--bg:#101b1b;--line:#45504a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,serif;min-height:100vh;
background-image:radial-gradient(ellipse at 50% 10%,#2e4140 0,transparent 65%)}
button,input{font:inherit}
button{min-height:44px;cursor:pointer;color:var(--ink);background:#253633;border:1px solid #697467;padding:11px 18px;transition:.15s}
button:hover{background:#3c4d43;border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.primary{background:var(--gold);color:#172322;border-color:var(--gold);font-weight:bold}
button.small{padding:7px 11px;font-size:13px}
input{min-width:0;background:#0e1919;border:1px solid var(--line);padding:10px;color:var(--ink);width:100%}
.shell{max-width:1080px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;gap:12px}
.eyebrow{font:11px/1.5 'Courier New',monospace;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(25px,4vw,39px);font-weight:normal;letter-spacing:4px;margin:3px 0}
.edition{color:var(--muted);font:12px 'Courier New',monospace}
.hud{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin-bottom:18px}
.stat{padding:12px;border-right:1px solid var(--line)}
.stat:last-child{border:0}.stat span{display:block;color:var(--muted);font:10px 'Courier New',monospace;letter-spacing:1px}
.stat strong{font-size:23px;font-weight:normal;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(0,650px) 1fr;gap:24px}
.stage{position:relative;border:1px solid var(--line);background:#111f20;overflow:hidden}
canvas{width:100%;display:block;touch-action:none;user-select:none}
.caption{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);gap:8px;font:11px 'Courier New',monospace;color:var(--muted)}
aside h2{font-size:22px;font-weight:normal;margin:0 0 5px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
#rules{display:grid;gap:7px}
.rule{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);background:#172727;font-size:13px}
.rule.ok{border-color:#799f80;background:#213a30}.badge{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;color:#142020;border-radius:50%;font:bold 15px Georgia}
.mark{margin-left:auto;color:#a4cfaa;min-width:12px}
.secret{border-top:1px solid var(--line);padding-top:14px;margin-top:18px;color:var(--gold);font-size:13px}
#message{min-height:47px;color:var(--gold);font-size:14px;margin:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
.overlay{position:fixed;inset:0;background:#081211df;backdrop-filter:blur(8px);display:flex;align-items:flex-start;padding:20px;z-index:5;overflow:auto}
.overlay[hidden]{display:none}
.card{margin:auto;max-width:580px;width:100%;border:1px solid #7a8069;background:#172726;padding:clamp(22px,5vw,42px);box-shadow:0 25px 100px #0008;position:relative}
.card:before{content:'✦';position:absolute;right:25px;top:18px;color:var(--gold);font-size:26px}
.card h2{font-size:clamp(32px,6vw,53px);font-weight:normal;line-height:1.1;margin:15px 0}
.card p{color:#c1c3ae}.card ol{padding-left:22px;color:#c1c3ae;font-size:14px}.card li{padding:4px 0}
.language-bar{display:flex;gap:8px;margin:0 28px 18px 0;flex-wrap:wrap}.language-bar button[aria-pressed="true"]{background:var(--gold);color:#172322}.menu-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.seed-form{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:8px;margin-top:18px}
.seed-form button{white-space:nowrap}label{font-size:12px;color:var(--muted)}
#panel{border-top:1px solid var(--line);padding-top:10px}#panel:empty{display:none}
.big-score{font-size:48px;color:var(--gold)}
footer{margin-top:16px;text-align:center;color:var(--muted);font:10px 'Courier New',monospace;letter-spacing:2px}
.compact-rule,.mobile-guide{display:none}
@media(max-width:740px){
 .shell{padding:6px 8px 60px}header{padding-bottom:4px;gap:6px;align-items:center}header .eyebrow{display:none}
 h1{font-size:19px;letter-spacing:1px;margin:0}#sound{font-size:10px;padding:3px 8px;min-height:32px}
 .hud{margin-bottom:5px}.stat{padding:4px}.stat span{font-size:8px;letter-spacing:0;white-space:nowrap}.stat strong{font-size:17px;line-height:1.1}
 .layout{grid-template-columns:1fr;gap:5px}.stage{width:100%}canvas{margin:auto}
 .caption{padding:3px 6px;font-size:9px;line-height:1.2}
 aside>.eyebrow,aside>h2,aside>.sub,footer{display:none}.mobile-guide{display:block;margin:0 0 4px;font-size:10px;line-height:1.2;color:var(--muted)}
 #rules{grid-template-columns:1fr 1fr;gap:4px}.rule{padding:4px 5px;gap:5px;font-size:11.5px;line-height:1.25;min-height:34px;align-items:center}
 .badge{width:19px;height:19px;font-size:12px}.mark{min-width:8px;font-size:10px}.full-rule{display:none}.compact-rule{display:inline}
 .secret{padding-top:4px;margin-top:5px;font-size:11px;line-height:1.25}#message{font-size:11px;line-height:1.25;margin:4px 0;min-height:14px}
 .actions{position:fixed;bottom:0;left:0;right:0;padding:5px 8px max(5px,env(safe-area-inset-bottom));gap:6px;background:#101b1bf5;border-top:1px solid var(--line);z-index:3}
 .actions button{font-size:13px;padding:6px 8px;min-height:40px}
 .overlay{padding:10px}.card{padding:18px}.card h2{font-size:29px;margin:10px 0}.card p,.card ol{font-size:12px;line-height:1.4}.card li{padding:3px 0}
 .language-bar{margin-bottom:12px}.menu-buttons{gap:5px;margin:12px 0}.menu-buttons button{font-size:12px;padding:7px 10px}.seed-form{flex-wrap:wrap;margin-top:10px;padding-top:10px}
}
@media(max-width:740px) and (orientation:landscape){
 .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.shell{max-width:none}#rules{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.badge{width:auto;min-width:26px;padding:0 6px;border-radius:13px;gap:2px;grid-auto-flow:column;font-size:13px}
.head-btns{display:flex;gap:8px;align-items:center}.stamps{font:13px 'Courier New',monospace;color:var(--gold);white-space:nowrap}
.progress-line{font:12px 'Courier New',monospace;color:var(--gold);letter-spacing:1px;margin:8px 0}
.menu-buttons.secondary button{flex:1 1 auto}
.shop-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.shop-row button{min-height:36px;padding:5px 10px;font-size:12px;white-space:nowrap}
.swatch{letter-spacing:2px;font-size:14px}.ach{display:flex;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)}.ach.locked{opacity:.55}
.panel-note{font-size:12px;color:var(--muted)}#hint[hidden]{display:none}
.newach{color:var(--gold);font-size:13px}
@media(max-width:740px){.stamps{font-size:11px}.badge{min-width:19px;padding:0 3px;font-size:10.5px}.shop-row{font-size:11.5px}}
</style>
</head>
<body>
<noscript><div style="position:fixed;inset:0;z-index:99;background:#101b1b;color:#eae0c8;padding:32px;font:18px/1.6 Georgia,serif">This game needs JavaScript. Please open it in a web browser with JavaScript enabled.<br><br>Táto hra potrebuje JavaScript. Otvor ju v prehliadači so zapnutým JavaScriptom.</div></noscript>
<main class="shell">
<header><div><div class="eyebrow" data-i="Department of misplaced dreams|Oddelenie stratených snov"></div><h1 data-i="MIDNIGHT MAIL|POLNOČNÁ POŠTA"></h1></div><div class="head-btns"><span class="stamps" id="stampsHud"></span><button id="sound" class="small" aria-pressed="false"></button></div></header>
<section class="hud" data-aria="Game status|Stav hry">
<div class="stat"><span data-i="ROUND TIME|ČAS KOLA"></span><strong id="time">36.0</strong></div>
<div class="stat"><span data-i="SCORE|BODY"></span><strong id="score">0</strong></div>
<div class="stat"><span data-i="LIVES|ŽIVOTY"></span><strong id="lives">♥ ♥ ♥</strong></div>
<div class="stat"><span data-i="ROUND|KOLO"></span><strong id="round">1</strong></div>
<div class="stat"><span data-i="SHIFT|SLUŽBA"></span><strong id="shift">90 s</strong></div>
</section>
<div class="layout">
<section class="stage"><canvas id="board" width="640" height="540" data-aria="Game board. Drag envelopes into the six mail cart slots. Tap an envelope to rotate it.|Herná plocha. Presuň obálky na šesť miest poštového vozíka. Ťuknutím ich otočíš."></canvas><div class="caption"><span id="modeLabel"></span><span>SEED <b id="seed">—</b></span><span data-i="DRAG · TAP TO ROTATE|ŤAHAJ · ŤUKNI = OTOČ"></span></div></section>
<aside><div class="eyebrow" data-i="The letters have wishes|Želania živých zásielok"></div><h2 data-i="Sort. Seal. Send.|Zoraď. Zapečať. Odošli."></h2><p class="sub" data-i="Beside means left or right in the same row. Top slots need a letter directly underneath.|Vedľa znamená vľavo alebo vpravo v rovnakom rade. Horná obálka potrebuje oporu priamo pod sebou."></p><p class="mobile-guide" data-i="Beside = same row. Top letters need support.|Vedľa = v rovnakom rade. Hore potrebuje oporu."></p><div id="rules"></div><div class="secret" id="secret"></div><p id="message" role="status" aria-live="polite"></p><div class="actions"><button id="check" class="primary" data-i="Send dreams|Odoslať sny"></button><button id="hint" class="small" hidden></button><button id="menu" class="small" data-i="Pause|Pauza"></button></div></aside>
</div><footer data-i="NIGHT SHIFT / EVERY DREAM HAS AN ADDRESS|NOČNÁ SLUŽBA / KAŽDÝ SEN MÁ ADRESÁTA"></footer>
</main>
<div class="overlay" id="overlay"><section class="card" id="card"></section></div>
<script>
'use strict';
// Midnight Mail — single-file HTML game. EN default, SK optional. Progress lives in localStorage only.
let lang='en', storageAvailable=true;
try{const s=localStorage.getItem('midnight-mail-language');if(['sk','en'].includes(s))lang=s}catch{storageAvailable=false}
const L=(en,sk)=>lang==='sk'?sk:en;
const $=id=>document.getElementById(id);
const SHIFT_SECONDS=90, ROUND_SECONDS=36, START_LIVES=3;
const SYMBOLS=['●','▲','■','◆','★','✚'];
const THEMES={
 classic:{cost:0,en:'Classic post',sk:'Klasická pošta',colors:['#e7c789','#8fc8bd','#d89b98','#b3acd3','#afd18d','#dfaf7c'],cart:['#7b8065','#3d4c40'],arc:'#304341'},
 aurora:{cost:60,en:'Aurora express',sk:'Polárny expres',colors:['#9fe3d0','#8fb9ff','#c9a8ff','#ffa8d4','#c2f29a','#ffe39a'],cart:['#6f8fb0','#2f4560'],arc:'#2d4060'},
 ember:{cost:90,en:'Steam & ember',sk:'Para a žiar',colors:['#f2b36b','#e88f73','#ddc77f','#cf9a78','#f2dcae','#c4876a'],cart:['#9a6a45','#4f3426'],arc:'#4a3a2c'},
 frost:{cost:120,en:'Frost line',sk:'Mrazivá trať',colors:['#e4f1ff','#b9d8f0','#cfc6f2','#a9e0e0','#f0e6c8','#c8d4dc'],cart:['#9fb1bf','#4d5c68'],arc:'#3c4f5c'}
};
const UPGRADES={
 time:{max:3,cost:l=>40+l*40,en:'+2 s every round',sk:'+2 s v každom kole'},
 life:{max:2,cost:l=>80+l*80,en:'+1 life per night',sk:'+1 život na noc'},
 hint:{max:3,cost:l=>50+l*50,en:'+1 hint per night',sk:'+1 rada na noc'}
};
const ACH=[
 ['first','First delivery','Prvá zásielka','Deliver a round.','Doruč jedno kolo.'],
 ['clean5','Steady hands','Pokojné ruky','5 careful rounds in one shift.','5 čistých kôl v jednej službe.'],
 ['secret3','Dream reader','Čitateľ snov','3 secret wishes in one shift.','3 tajné želania v jednej službe.'],
 ['six','Full cart','Plný vozík','Deliver a round with 6 letters.','Doruč kolo so 6 obálkami.'],
 ['night5','Night owl','Nočná sova','Clear night 5 in Career.','Prejdi noc 5 v kariére.'],
 ['daily','Early edition','Ranné vydanie','Finish a daily challenge.','Dokonči dennú výzvu.'],
 ['score5k','Express mail','Expresná pošta','Score 5000 in one shift.','Získaj 5000 bodov v jednej službe.'],
 ['theme','Collector','Zberateľ','Buy a new theme.','Kúp si novú tému.']
];
// ---------- persistent progress ----------
const PKEY='midnight-mail-progress-v1';
const int=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.floor(Number(v))||0));
function sanitize(o){
 o=o&&typeof o==='object'?o:{};const up=o.up||{};
 const themes=Array.isArray(o.themes)?o.themes.filter(t=>THEMES[t]):[];if(!themes.includes('classic'))themes.unshift('classic');
 const ach={};if(o.ach&&typeof o.ach==='object')for(const [id] of ACH)if(o.ach[id])ach[id]=1;
 const d=o.daily&&typeof o.daily==='object'?o.daily:{};
 return{stamps:int(o.stamps,0,1e7),night:int(o.night,1,999)||1,best:int(o.best,0,1e9),
  up:{time:int(up.time,0,3),life:int(up.life,0,2),hint:int(up.hint,0,3)},themes,theme:THEMES[o.theme]&&themes.includes(o.theme)?o.theme:'classic',ach,
  daily:{date:/^\d{8}$/.test(d.date)?d.date:'',best:int(d.best,0,1e9)}};
}
let prog;
try{prog=sanitize(JSON.parse(localStorage.getItem(PKEY)||'{}'));const old=localStorage.getItem('polnocna-posta-best-v2');if(old)prog.best=Math.max(prog.best,int(old,0,1e9))}catch{storageAvailable=false;prog=sanitize({})}
function save(){try{localStorage.setItem(PKEY,JSON.stringify(prog))}catch{storageAvailable=false}}
function todayKey(){const d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
const colors=()=>THEMES[prog.theme].colors;
// ---------- game state ----------
const canvas=$('board'),ctx=canvas.getContext('2d');
let boardOffset=0;
function fitBoard(){boardOffset=window.matchMedia('(max-width:740px)').matches?120:0;canvas.height=540-boardOffset}
window.addEventListener('resize',fitBoard);fitBoard();
const slots=Array.from({length:6},(_,i)=>({x:200+(i%3)*120,y:i<3?322:432}));
const shelfX=b=>70+b.id*100, SHELF_Y=140;
let bones=[],state='menu',mode='quick',score=0,lives=3,round=1,combo=0,cleared=0,cleanRounds=0,secrets=0,hints=0,night=1,target=0;
let roundLimit=ROUND_SECONDS,roundWon=false,remaining=ROUND_SECONDS,shiftLeft=SHIFT_SECONDS,seed='',clean=true,secret=null,drag=null;
let last=performance.now(),transition=0,errors=[],audio=null,muted=true,newAch=[],pausedState=null,rnd=Math.random,dailyDate='';
function randomSeed(){return (Math.random()*0xffffffff>>>0).toString(36).toUpperCase()}
function generator(text){let h=2166136261;for(const c of text)h=Math.imul(h^c.charCodeAt(0),16777619);
 return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(kind){if(muted)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();
 const notes=kind==='win'?[392,523,659]:kind==='fail'?[160,110]:kind==='ach'?[523,659,784,1046]:[310];
 notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2)})}catch{}}
const tag=b=>SYMBOLS[b.color]+b.num;
function grant(id){if(prog.ach[id])return;prog.ach[id]=1;const a=ACH.find(x=>x[0]===id);newAch.push(a);save();tone('ach');
 if(state==='playing'||state==='transition')$('message').textContent+=' · ★ '+L(a[1],a[2])}
function roundDuration(level){
 const min=mode==='career'?Math.max(12,18-Math.floor((night-1)/2)):18;
 return Math.max(min,ROUND_SECONDS-(level-1)*3)+(mode==='career'?2*prog.up.time:0)}
// ---------- texts ----------
function ruleText(r){
 if(r.type==='row')return r.value?L('I want to be on the bottom.','Chcem byť dole.'):L('I want to be on top.','Chcem byť hore.');
 if(r.type==='axis')return r.value?L('Keep me vertical.','Chcem stáť zvislo.'):L('Keep me horizontal.','Chcem ležať vodorovne.');
 if(r.type==='col')return[L('I want to be on the left.','Chcem byť vľavo.'),L('I want to be in the middle.','Chcem byť v strede.'),L('I want to be on the right.','Chcem byť vpravo.')][r.value];
 if(r.type==='lock')return L('Do not rotate me.','Nesmieš ma otočiť.');
 if(r.type==='parity')return r.value?L('Put me beside an odd number.','Daj ma vedľa nepárneho čísla.'):L('Put me beside an even number.','Daj ma vedľa párneho čísla.');
 const o=bones.find(b=>b.id===r.value);return L(`Put me beside ${tag(o)}.`,`Daj ma vedľa ${tag(o)}.`)}
function shortRule(r){
 if(r.type==='row')return r.value?L('Bottom','Dole'):L('Top','Hore');
 if(r.type==='col')return[L('Left','Vľavo'),L('Middle','V strede'),L('Right','Vpravo')][r.value];
 if(r.type==='axis')return r.value?L('Vertical','Zvislo'):L('Horizontal','Vodorovne');
 if(r.type==='lock')return L('Do not rotate','Neotáčať');
 if(r.type==='parity')return r.value?L('Beside odd','Vedľa nepárnej'):L('Beside even','Vedľa párnej');
 return L('Beside ','Vedľa ')+tag(bones.find(b=>b.id===r.value))}
function secretText(){return{order:L('Bottom numbers should rise from left to right.','Čísla dolu nech stúpajú zľava doprava.'),axis:L('Keep at least three letters horizontal.','Aspoň tri obálky nech ležia vodorovne.'),speed:L('Send us in less than eight seconds.','Odošli nás za menej než osem sekúnd.')}[secret.type]}
function modeLabel(){if(mode==='career')return L(`NIGHT ${night} · GOAL ${target}`,`NOC ${night} · CIEĽ ${target}`);
 if(mode==='daily')return L('DAILY ','DENNÁ ')+dailyDate.slice(0,4)+'-'+dailyDate.slice(4,6)+'-'+dailyDate.slice(6);return L('QUICK SHIFT','RÝCHLA SLUŽBA')}
function renderRules(){
 if(!bones.length||!secret)return;
 $('rules').innerHTML=bones.map(b=>`<div class="rule" id="rule${b.id}"><span class="badge" style="background:${colors()[b.color]}" aria-label="${tag(b)}">${tag(b)}</span><span><span class="full-rule">${b.rules.map(ruleText).join(' ')}</span><span class="compact-rule">${b.rules.map(shortRule).join(' · ')}</span></span><span class="mark"></span></div>`).join('');
 $('secret').textContent=L('◇ Secret wish · “','◇ Tajné želanie · „')+secretText()+L('”','“');
 $('modeLabel').textContent=modeLabel();updateHint();refreshRules()}
function updateHint(){const h=$('hint');h.hidden=!(mode==='career'&&prog.up.hint>0);h.textContent=L('Hint','Rada')+' ('+hints+')';h.disabled=hints<=0}
// ---------- menu & panels ----------
const instructions=()=>L(`<ol><li>Drag falling letters from the arrivals shelf into the six mail cart slots.</li><li>Click or tap a letter to rotate it by 90°. Each letter has a colour, a symbol and a number.</li><li>Meet every wish and press “Send dreams”. Every top letter needs a letter underneath.</li><li>Dropping onto an occupied slot or running out of round time costs a life; sending an unfinished cart costs two seconds.</li><li><b>Career:</b> reach the night's goal to unlock the next, harder night. Earn ✉ stamps in every mode and spend them on upgrades and themes.</li></ol>`,
 `<ol><li>Presuň padajúce obálky z prijímacej police na šesť miest poštového vozíka.</li><li>Kliknutím alebo ťuknutím obálku otočíš o 90°. Každá obálka má farbu, symbol a číslo.</li><li>Splň všetky želania a stlač „Odoslať sny“. Každá horná obálka potrebuje obálku pod sebou.</li><li>Pustenie na obsadené miesto alebo vypršanie času kola stojí život; odoslanie nedokončeného vozíka uberie dve sekundy.</li><li><b>Kariéra:</b> dosiahni cieľ noci a odomkneš ďalšiu, ťažšiu noc. V každom režime zbieraš ✉ známky a míňaš ich na vylepšenia a témy.</li></ol>`);

// ---------- flow ----------
function start(m,replay){

 const rotations=bones.map(()=>Math.floor(rnd()*4));
 bones.forEach((b,i)=>{const s=solution[i];b.sol=s;b.solRot=rotations[i];
  const near=bones.filter((v,j)=>j!==i&&Math.floor(solution[j]/3)===Math.floor(s/3)&&Math.abs(solution[j]-s)===1);
  const opt=[{type:'row',value:s<3?0:1},{type:'axis',value:rotations[i]%2},{type:'col',value:s%3}];
  if(near.length){const nb=pick(near);opt.push({type:'neighbor',value:nb.id});opt.push({type:'parity',value:nb.num%2})}

 $('seed').textContent=seed;$('message').textContent=L('Empty slots welcome letters. Occupied slots make their dreams burst.','Voľné miesto prijme obálku. Na obsadenom sa jej sen rozplynie.');
 renderRules();updateHUD()}
function neighbors(b){return bones.filter(v=>v!==b&&v.slot!==null&&Math.floor(v.slot/3)===Math.floor(b.slot/3)&&Math.abs(v.slot-b.slot)===1)}

 if(r.type==='row')return Math.floor(b.slot/3)===r.value;if(r.type==='col')return b.slot%3===r.value;
 if(r.type==='axis')return b.rot%2===r.value;if(r.type==='lock')return b.rot===r.value;

function refreshRules(){bones.forEach(b=>{const el=$('rule'+b.id);if(!el)return;const ok=b.rules.every(r=>validRule(b,r));el.classList.toggle('ok',ok);el.querySelector('.mark').textContent=ok?'✓':''})}

function secretMet(){if(secret.type==='speed')return roundLimit-remaining<8;if(secret.type==='axis')return bones.filter(b=>b.rot%2===0).length>=3;

function check(){

function fail(reason){if(state!=='playing')return;roundWon=false;lives--;combo=0;drag=null;errors.push({reason,seed});

<p>${record?L('New record! ','Nový rekord! '):''}${L('High score','Rekord')}: ${prog.best} · ${L('Rounds delivered','Doručené kolá')}: ${cleared}</p>${line?`<p><b>${line}</b></p>`:''}<p>+${earned} ✉ ${L('stamps','známok')} · ${L('total','spolu')} ${prog.stamps}</p>
${newAch.map(a=>`<p class="newach">★ ${L('Achievement','Úspech')}: ${L(a[1],a[2])}</p>`).join('')}<div id="recap"></div><p id="lastseed"></p>
<div class="menu-buttons"><button class="primary" id="again">${primary}</button>${mode==='daily'?'':`<button id="retry">${L('Replay last seed','Zopakovať posledný seed')}</button>`}<button id="back">${L('Menu','Menu')}</button></div>`;
 const recap=$('recap');if(!errors.length)recap.textContent=L('Not a single life lost. Tonight, someone will dream of something wonderful.','Bez strateného života. Dnes sa bude niekomu snívať o niečom krásnom.');
 errors.slice(-3).forEach(e=>{const p=document.createElement('p');p.textContent=e.reason+' · Seed '+e.seed;recap.appendChild(p)});
 $('lastseed').textContent=L('Last round: ','Posledné kolo: ')+seed;
 const s=seed,m=mode;$('again').onclick=()=>start(m);if($('retry'))$('retry').onclick=()=>start('quick',s);$('back').onclick=showMenu}
// ---------- input ----------
function dims(b){return b.rot%2?{w:34,h:82}:{w:82,h:34}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*canvas.height/r.height+boardOffset}}
function hit(b,p){const d=dims(b);return Math.abs(p.x-b.x)<d.w/2+8&&Math.abs(p.y-b.y)<d.h/2+8}
// Smoothly glide a letter back to its place on the arrivals shelf.
function sendHome(b){b.slot=null;b.vx=0;b.vy=0;b.home={t:0,fx:b.x,fy:b.y}}
canvas.onpointerdown=e=>{if(state!=='playing'||drag||e.button>0)return;const p=point(e),b=[...bones].reverse().find(b=>hit(b,p));if(!b)return;
 canvas.setPointerCapture(e.pointerId);b.home=null;drag={b,id:e.pointerId,start:p,dx:p.x-b.x,dy:p.y-b.y,moved:false}};

canvas.onpointerup=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag,b=d.b;drag=null;
 if(!d.moved){if(b.rules.some(r=>r.type==='lock')){$('message').textContent=L('This letter asks you not to rotate it.','Táto obálka prosí: nesmieš ma otočiť.');tone('click');return}
  b.rot=(b.rot+1)%4;b.vy=0;tone('click');refreshRules();return}

 const ordered=bones.filter(b=>!drag||b!==drag.b);if(drag)ordered.push(drag.b);
 ordered.forEach(b=>{ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot*Math.PI/2);
  ctx.shadowColor='#0008';ctx.shadowBlur=drag&&drag.b===b?18:7;ctx.shadowOffsetY=5;rounded(-41,-17,82,34,4,th.colors[b.color]);
  ctx.shadowColor='transparent';ctx.strokeStyle='#18252465';ctx.beginPath();ctx.moveTo(-39,-15);ctx.lineTo(0,7);ctx.lineTo(39,-15);ctx.moveTo(-39,15);ctx.lineTo(-17,0);ctx.moveTo(39,15);ctx.lineTo(17,0);ctx.stroke();
  ctx.fillStyle='#f9eedb';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#192724cc';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 13px sans-serif';ctx.fillText(SYMBOLS[b.color],-28,0);ctx.fillText(SYMBOLS[b.color],28,0);
  ctx.rotate(-b.rot*Math.PI/2);ctx.fillStyle='#192724';ctx.font='bold 22px Georgia';ctx.fillText(b.num,0,1);ctx.restore()});
 ctx.textBaseline='alphabetic';if(!bones.length){ctx.textAlign='center';ctx.fillStyle='#d4b779';ctx.font='60px Georgia';ctx.fillText('✦',320,155)}
 ctx.restore()}
function frame(now){const el=Math.max(0,(now-last)/1000);last=now;
 if(state==='playing'||state==='transition'){shiftLeft-=el;
  if(state==='playing'){remaining-=el;physics(Math.min(el,.035));
   if(remaining<=0){const bad=bones.find(b=>!b.rules.every(r=>validRule(b,r)));fail(L('Round time ran out.','Vypršal čas kola.')+(bad?L(' Unfinished: ',' Nesplnené: ')+tag(bad)+' '+bad.rules.filter(r=>!validRule(bad,r)).map(ruleText).join(' '):L(' You forgot to press “Send dreams”.',' Chýbalo potvrdenie „Odoslať sny“.')))}}
  else{physics(Math.min(el,.035));transition-=el;if(transition<=0&&shiftLeft>0){if(roundWon)round++;newRound()}}
  if(shiftLeft<=0&&state!=='over')finish(true);updateHUD()}
 draw();requestAnimationFrame(frame)}
// ---------- pause & language ----------
function pauseGame(){if(!['playing','transition'].includes(state))return;pausedState=state;state='paused';
 if(drag){if(drag.moved){sendHome(drag.b);clean=false}drag=null;refreshRules()}
 if(audio)audio.suspend().catch(()=>{});$('overlay').hidden=false;renderPause()}
function renderPause(){
 $('card').innerHTML=`${langBar()}<div class="eyebrow">${L('Your dreams can wait','Tvoje sny počkajú')}</div><h2>${L('Shift paused.','Služba pozastavená.')}</h2><p>${L('Your timers are stopped. Continue when you are ready.','Časovače sú zastavené. Pokračuj, keď budeš pripravený.')}</p><div class="menu-buttons"><button id="resume" class="primary">${L('Continue shift','Pokračovať v službe')}</button><button id="quit">${L('Quit to menu','Ukončiť do menu')}</button></div>`;
 bindLang();
 $('resume').onclick=()=>{state=pausedState;pausedState=null;last=performance.now();$('overlay').hidden=true;if(audio&&!muted)audio.resume().catch(()=>{})};
 $('quit').onclick=showMenu}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();last=performance.now()});
function soundLabel(){$('sound').textContent=L('Sound: ','Zvuk: ')+(muted?L('off','vypnutý'):L('on','zapnutý'));$('sound').setAttribute('aria-pressed',String(!muted))}
function localizePage(){
 document.documentElement.lang=lang;document.title=L('Midnight Mail — the last dream train','Polnočná pošta — posledný vlak snov');
 document.querySelectorAll('[data-i]').forEach(el=>{const [en,sk]=el.dataset.i.split('|');el.textContent=L(en,sk)});
 document.querySelectorAll('[data-aria]').forEach(el=>{const [en,sk]=el.dataset.aria.split('|');el.setAttribute('aria-label',L(en,sk))});
 soundLabel();updateStampsHud();updateHUD();renderRules();
 if(state==='menu'&&!bones.length)$('message').textContent=L('The last train to the dream world is waiting for you.','Posledný vlak do ríše snov čaká na teba.')}
function setLanguage(v){if(!['sk','en'].includes(v)||!['menu','paused'].includes(state))return;
 lang=v;try{localStorage.setItem('midnight-mail-language',lang)}catch{}
 localizePage();if(state==='paused')renderPause();else{const s=$('seedInput').value;showMenu();$('seedInput').value=s}}
$('sound').onclick=()=>{muted=!muted;soundLabel();tone('click')};
$('check').onclick=check;$('menu').onclick=pauseGame;$('hint').onclick=useHint;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state==='playing'&&e.target===document.body)check();if(e.key==='Escape'){if(state==='playing'||state==='transition')pauseGame();else if(state==='paused')$('resume').click()}});
localizePage();showMenu();requestAnimationFrame(frame);
</script>
